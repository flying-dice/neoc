[package]
name = "neoc-net"
description = "The HTTP and WebSocket clients under neoc's modules"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
url = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# The HTTP client. `client-legacy` for its `HttpConnector`: name lookup and Happy Eyeballs (RFC 8305) for the TCP
# connect.
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
tower-service = "0.3"
http-body-util = "0.1"
# TLS: rustls over the `ring` provider, the certificate checked by the platform verifier.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# The WebSocket. The socket is ours (TCP, and TLS for `wss`), so the crate's own TLS features stay off.
tokio-tungstenite = { workspace = true }

[dev-dependencies]
serde_json = "1"

[lints.cargo]
missing_lints_inheritance = "allow"
