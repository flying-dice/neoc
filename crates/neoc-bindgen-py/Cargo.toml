[package]
name = "neoc-bindgen-py"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "neoc-bindgen-py"
path = "src/main.rs"

[lib]
name = "neoc_bindgen_py"
path = "src/lib.rs"

[dependencies]
tree-sitter.workspace = true
tree-sitter-python = "0.25"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
neoc-compiler.workspace = true

[lints]
workspace = true
