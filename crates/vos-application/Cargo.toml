[package]
name = "vos-application"
description = "Ports (traits) + use cases. Depends on the domain and nothing else but async-trait/serde_json/thiserror."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[features]
testing = []   # in-memory fakes of every port, for application tests and the host e2e test

[dependencies]
vos-domain = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
# the RPC bus holds every request and notification to the app's OpenRPC contract (its params and results are JSON Schema)
jsonschema = { version = "0.61", default-features = false }

[dev-dependencies]
tokio = { workspace = true }   # test runtime only

[lints]
workspace = true
