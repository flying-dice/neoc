[package]
name = "vos-codegen"
description = "Adapter (dev-time): generates the shell's TypeScript wire types (ts-rs) and the Luau declarations for app authors (the `app` API, neoc's modules less the refused ones)."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[dependencies]
vos-domain = { workspace = true, features = ["codegen"] }
serde_json = { workspace = true }
ts-rs = { workspace = true }

[lints]
workspace = true
