[package]
name = "neoc-codegen-js"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neoc-ast.workspace = true

[dev-dependencies]
neoc-parser.workspace = true
# Behavioural spec: Gherkin features in `tooling/codegen-js/` driven against
# `emit`. cucumber supplies its own runner (default libtest harness disabled
# below); `futures::executor::block_on` drives it so this pure leaf crate stays
# tokio-free.
cucumber = "0.21.1"
futures = "0.3"

[lints]
workspace = true

[[test]]
name = "cucumber"
harness = false
