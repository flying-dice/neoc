[package]
name = "neoc"
version.workspace = true
edition.workspace = true
default-run = "neoc"
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The runtime library: engine construction and script execution.
neoc-vm2 = { workspace = true }
thiserror = "2"

# `mlua::Error` surfaces when a script fails; the bin maps it to a plain
# diagnostic. `miette` renders the runtime's `NeocError`. Both are the runtime's
# public error types crossing into the bin.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
miette = { version = "7", features = ["fancy"] }

# The bin owns the tokio runtime the engine paths drive on, the clap tree, and
# glob expansion for `run`.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string", "derive"] }
globset = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

# Behavioural CLI spec: Gherkin features in `tooling/cli/` driven against the
# built `neoc` binary as a subprocess. cucumber supplies its own runner (default
# libtest harness disabled below); `futures::executor::block_on` drives it — the
# step bodies are synchronous (`std::process::Command`), so no tokio is needed
# for the harness itself.
cucumber = "0.23.0"
futures = "0.3"

[[test]]
name = "cucumber"
harness = false

# The root `[workspace.lints]` table (clippy pedantic, `unsafe_code = "forbid"`) is
# inherited by the vos crates only. The neoc crates never inherited it: when it
# was imported with the old compiler crates, opting in meant ~700 pedantic findings
# and six `unsafe` blocks (counted against the table as it was then, which did not
# deny `unwrap`/`expect`/`panic`). Adopting it is its own change, so silence cargo's
# "missing lints inheritance" nag until then.
[lints.cargo]
missing_lints_inheritance = "allow"
