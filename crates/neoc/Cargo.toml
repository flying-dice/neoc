[package]
name = "neoc"
version.workspace = true
edition.workspace = true
default-run = "neoc"
publish = false

[dependencies]
# The runtime library: engine construction, script execution, and `.neoc`
# header emission. The bin dispatches `run`/`emit-headers` here.
neoc-vm = { workspace = true }

# The compiler half of the unified `neoc` CLI. The bin folds the
# `build`/`check`/`fmt`/`lsp` subcommands in directly (the `cli` module) and
# dispatches them to these libs.
neoc-compiler.workspace = true
neoc-fmt.workspace = true
neoc-lsp.workspace = true

# The SQL → neoc generator backing `neoc autosql`. A compiler-domain tool: it
# emits portable `.neoc` source and couples to no runtime module.
neoc-autosql.workspace = true

# `mlua::Error` surfaces when a script fails; the bin maps it to a neoc-shaped
# diagnostic. `miette` renders the runtime's `NeocError`. Both are the runtime's
# public error types crossing into the bin.
mlua = { version = "0.10", features = ["luajit", "async", "send", "vendored", "serialize", "macros"] }
miette = { version = "7", features = ["fancy"] }

# The bin owns the tokio runtime the engine paths drive on, the unified clap
# tree, glob expansion for `run`, and tree-walking for the same.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string", "derive"] }
globset = "0.4"
walkdir = "2"

# Glob expansion + diagnostic plumbing for the folded compiler subcommands.
anyhow = "1"
glob = "0.3"

[dev-dependencies]
tempfile = "3"

# Behavioural CLI spec: Gherkin features in `tooling/cli/` driven against the
# built `neoc` binary as a subprocess. cucumber supplies its own runner (default
# libtest harness disabled below); `futures::executor::block_on` drives it — the
# step bodies are synchronous (`std::process::Command`), so no tokio is needed
# for the harness itself.
cucumber = "0.21.1"
futures = "0.3"

[[test]]
name = "cucumber"
harness = false
