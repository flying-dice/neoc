[package]
name = "neoc-lib-pkey"
description = "lib:pkey"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_lib_pkey"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sha2 = "0.11"
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core", "digest"] }
p256 = { version = "0.14", features = ["pem"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
signature = "3"
pkcs8 = { version = "0.11", features = ["pem", "std"] }
spki = { version = "0.8", features = ["pem", "std"] }
rand = "0.10"

[lints.cargo]
missing_lints_inheritance = "allow"
