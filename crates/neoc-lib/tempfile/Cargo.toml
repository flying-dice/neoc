[package]
name = "neoc-lib-tempfile"
description = "lib:tempfile"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_lib_tempfile"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
parking_lot = "0.13"
tempfile = "3"

[dev-dependencies]
neoc-vm-std = { workspace = true }

[lints.cargo]
missing_lints_inheritance = "allow"
