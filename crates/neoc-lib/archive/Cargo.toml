[package]
name = "neoc-lib-archive"
description = "lib:archive"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_lib_archive"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-lib-glob = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# `lib:archive`, `lib:glob` and `lib:http`: iterative tree walks.
walkdir = "2"
tempfile = "3"
globset = "0.4"
# `lib:compress` (and the layers under `lib:archive`'s tarballs).
flate2 = "1"
zstd = "0.14"
# `lib:archive`. zip without its default features: DEFLATE alone, through the flate2 already here. Its `deflate`
# feature would add flate2's zlib-rs backend and, by feature unification, change the bytes `lib:compress` writes; it
# is named by its two parts without zlib-rs.
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }

[dev-dependencies]
neoc-vm-std = { workspace = true }

[lints.cargo]
missing_lints_inheritance = "allow"
