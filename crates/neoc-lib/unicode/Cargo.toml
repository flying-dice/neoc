[package]
name = "neoc-lib-unicode"
description = "lib:unicode"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_lib_unicode"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
caseless = "0.2"

[lints.cargo]
missing_lints_inheritance = "allow"
