[package]
name = "neoc-lib-args"
description = "lib:args"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_lib_args"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# `lib:args`: clap's builder as a run-time argument parser (no derive: that is a binary's concern).
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }

[lints.cargo]
missing_lints_inheritance = "allow"
