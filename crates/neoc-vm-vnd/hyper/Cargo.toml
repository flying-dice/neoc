[package]
name = "neoc-vm-vnd-hyper"
description = "vnd:hyper"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_vnd_hyper"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-net = { workspace = true }
neoc-vm-std = { workspace = true }
neoc-vm-lib-json = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
parking_lot = "0.13"
serde_json = "1"
url = "2"
# `vnd:hyper`'s server. The client is `neoc-net`'s.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
neoc-vm-std = { workspace = true, features = ["testing"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints.cargo]
missing_lints_inheritance = "allow"
