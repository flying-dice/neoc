[package]
name = "neoc-vm-vnd-agent_client_protocol"
description = "vnd:agent_client_protocol"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_vnd_agent_client_protocol"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
# The transport: a `lib:websocket` socket's lines.
neoc-vm-lib-websocket = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# `vnd:agent_client_protocol`: the official ACP SDK (its v1 client role, its sessions and its schema types). No
# features: its process and stdio adapters are for running an agent, which this module does not do.
agent-client-protocol = "5.6"

[dev-dependencies]
neoc-vm-std = { workspace = true, features = ["testing"] }
tokio-tungstenite = { workspace = true }

[lints.cargo]
missing_lints_inheritance = "allow"
