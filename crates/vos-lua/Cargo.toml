[package]
name = "vos-lua"
description = "Adapter: apps (Luau, run on neoc-vm2) implementing the AppRuntime port, one VM per app."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[dependencies]
vos-domain = { workspace = true }
vos-application = { workspace = true }
async-trait = { workspace = true }
neoc-vm2 = { workspace = true }  # the Lua VM (Luau); mlua is reached through its re-export
mlua-ir = { workspace = true }   # the `app` API is an mlua-ir module: its declarations are read from its Rust
notify = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }  # the temporary file a write or a copy is renamed from (app.files)
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# adapter integration tests run apps against the REAL sqlite adapter (dev-only edge, not a runtime one)
vos-sqlite = { path = "../vos-sqlite" }
vos-application = { workspace = true, features = ["testing"] }

[lints]
workspace = true
