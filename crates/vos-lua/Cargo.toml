[package]
name = "vos-lua"
description = "Adapter: apps (Luau, run on neoc-vm) implementing the AppRuntime port, one VM per app."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[dependencies]
vos-domain = { workspace = true }
vos-application = { workspace = true }
async-trait = { workspace = true }
neoc-vm = { workspace = true }  # the Lua VM (Luau); mlua is reached through its re-export
notify = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# adapter integration tests run apps against the REAL sqlite adapter (dev-only edge, not a runtime one)
vos-sqlite = { path = "../vos-sqlite" }
vos-application = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }

[lints]
workspace = true
