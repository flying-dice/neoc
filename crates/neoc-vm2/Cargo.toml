[package]
name = "neoc-vm2"
description = "neoc's Lua runtime, rebuilt on mlua-ir: modules written once in Rust, declarations read from the schema"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm2"
path = "src/lib.rs"

[dependencies]
mlua-ir = { workspace = true }
mlua-ir-gen = { git = "https://github.com/flying-dice/mlua-ir.git", rev = "b58b00b07c426fe02a1383573172b98cdce7a8c3" }
# The engine is Luau, as in neoc-vm; the same features.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-core = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
parking_lot = "0.13"
futures = { version = "0.3", default-features = false, features = ["std"] }
strsim = "0.11"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1"
md-5 = "0.11"
sha1 = "0.11"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
rand = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
hmac = "0.13"
subtle = "2"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
serde_json = "1"

[dev-dependencies]
neoc-vm = { workspace = true }

[lints.cargo]
missing_lints_inheritance = "allow"
