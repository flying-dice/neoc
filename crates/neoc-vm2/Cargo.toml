[package]
name = "neoc-vm2"
description = "neoc's Lua runtime, rebuilt on mlua-ir: modules written once in Rust, declarations read from the schema"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm2"
path = "src/lib.rs"

[dependencies]
mlua-ir = { workspace = true }
mlua-ir-gen = { git = "https://github.com/flying-dice/mlua-ir.git", rev = "e283fe8cc3b11d5306e1af8e035027deaca792ea" }
# The engine is Luau, as in neoc-vm; the same features.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-core = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process"] }
parking_lot = "0.13"
futures = { version = "0.3", default-features = false, features = ["std"] }
strsim = "0.11"
base64 = "0.23"
hex = "0.4"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1"
md-5 = "0.11"
sha1 = "0.11"
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core", "digest"] }
p256 = { version = "0.14", features = ["pem"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
signature = "3"
pkcs8 = { version = "0.11", features = ["pem", "std"] }
spki = { version = "0.8", features = ["pem", "std"] }
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
rand = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
hmac = "0.13"
subtle = "2"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = { version = "0.42", features = ["serialize"] }
jsonschema = { version = "0.61", default-features = false, features = ["idna"] }
heck = "0.5"
unicode-width = "0.2"
deunicode = "1"
vte = "0.14"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
caseless = "0.2"
regex = "1"
semver = "1"
mime_guess = "2"
similar = "3"
rust-ini = "0.21"
csv = "1"
toml = { version = "1.2", features = ["parse", "display"] }
url = "2"
percent-encoding = "2"
# `std:fs`: iterative tree walks, and the operating system's own directory watching (9.0 at least: see
# `std/fs/watch.rs`).
walkdir = "2"
notify = "9.0"
# `std:fs` stages a cross-device move beside its destination; `lib:tempfile` is this crate.
tempfile = "3"
globset = "0.4"
# `lib:chrono`: civil dates, IANA zones, RFC 3339 and strftime (the default features bundle the tzdb on Windows).
jiff = "1.0"
# `lib:cache`: the bounded least-recently-used map.
lru = "0.19"
# `lib:compress` (and the layers under `lib:archive`'s tarballs).
flate2 = "1"
zstd = "0.14"
brotli = "9"
# `lib:args`: clap's builder as a run-time argument parser (no derive: that is a binary's concern).
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }

# `std:process` kills a process's whole group.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
neoc-vm = { workspace = true }

[lints.cargo]
missing_lints_inheritance = "allow"
