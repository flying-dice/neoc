[package]
name = "neoc-ast"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Behavioural spec: Gherkin features in `tooling/ast/` driven against the
# extern/`ext` query functions. cucumber supplies its own runner (default
# libtest harness disabled below); `futures::executor::block_on` drives it so
# this pure, wasm-leaf crate stays tokio-free. `neoc-parser` builds a `Module`
# from source — a dev-only cycle (ast ← parser), allowed since it never reaches
# the published crate graph.
cucumber = "0.21.1"
futures = "0.3"
neoc-parser.workspace = true

[[test]]
name = "cucumber"
harness = false
