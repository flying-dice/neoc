[package]
name = "neoc-vnd-quick_xml"
description = "vnd:quick_xml"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vnd_quick_xml"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-vm-std = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
quick-xml = { version = "0.42", features = ["serialize"] }

[dev-dependencies]
neoc-vm-std = { workspace = true, features = ["testing"] }

[lints.cargo]
missing_lints_inheritance = "allow"
