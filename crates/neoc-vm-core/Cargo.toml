[package]
name = "neoc-vm-core"
description = "The core of neoc's Lua runtime: engine, lifecycle, scheduler, the mlua-ir host and the helpers the modules share"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_core"
path = "src/lib.rs"

[dependencies]
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-core = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
parking_lot = "0.13"
futures = { version = "0.3", default-features = false, features = ["std"] }
strsim = "0.11"
rand = "0.10"

[lints.cargo]
missing_lints_inheritance = "allow"
