[package]
name = "neoc-macros"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neoc-ast.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Behavioural spec: Gherkin features in `tooling/macros/` driven against
# `derive`. The features parse real `.neoc` source (`neoc-parser`), pull the
# `struct`/`enum` declaration out of the AST (`neoc-ast`), and assert the
# emitted Lua lines. cucumber supplies its own runner (default libtest harness
# disabled below); `futures::executor::block_on` drives it so this pure crate
# stays tokio-free.
cucumber = "0.21.1"
futures = "0.3"
neoc-parser.workspace = true
neoc-ast.workspace = true

[[test]]
name = "cucumber"
harness = false
