[package]
name = "neoc-wasm"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neoc-compiler.workspace = true

# wasm-bindgen and the cdylib crate-type are added when the browser build
# lands. Today this is a plain library so the host workspace builds cleanly;
# making the compiler graph wasm-clean is tracked separately.

[lints]
workspace = true

[dev-dependencies]
# Behavioural spec: Gherkin features in `tooling/wasm/` document the intended
# browser-entry contract. The crate is a stub today (no wasm-bindgen surface
# yet), so every scenario is `@chaos @pending` and the runner filters them out —
# the harness compiles and the suite is green. The features land their `When`/
# `Then` assertions once the wasm-bindgen export over `neoc-compiler` exists.
# cucumber supplies its own runner (default libtest harness disabled below);
# `futures::executor::block_on` drives it so this crate stays tokio-free.
cucumber = "0.21.1"
futures = "0.3"

[[test]]
name = "cucumber"
harness = false
