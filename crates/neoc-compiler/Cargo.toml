[package]
name = "neoc-compiler"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neoc-ast.workspace = true
neoc-parser.workspace = true
neoc-types.workspace = true
neoc-codegen-lua.workspace = true
neoc-codegen-js.workspace = true
neoc-macros.workspace = true
toml = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
libtest-mimic = "0.8"
neoc-grammar.workspace = true
# The dynamic conformance JS run harness writes the shared `neoc-lib.js` runtime
# beside the emitted module (Result/Option import their runtime from it). Named
# directly here rather than re-exported through the compiler's public API.
neoc-codegen-js.workspace = true
tree-sitter.workspace = true
# Behavioural spec: Gherkin features in `tooling/compiler/` driven against the
# public `transpile` seam. cucumber supplies its own runner (default libtest
# harness disabled below); `futures::executor::block_on` drives it so this pure
# crate stays tokio-free.
cucumber = "0.21.1"
futures = "0.3"

[[test]]
name = "cucumber"
harness = false

[[test]]
name = "conformance"
harness = false

[[test]]
name = "conformance_static"
harness = false

[[test]]
name = "conformance_syntax"
harness = false
