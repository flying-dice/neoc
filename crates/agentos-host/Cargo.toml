[package]
name = "agentos-host"
description = "Composition root: the only crate that knows every adapter. Wires adapters into the application and serves."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
agentos-domain = { workspace = true }
agentos-application = { workspace = true }
agentos-luau = { workspace = true }
agentos-sqlite = { workspace = true }
agentos-fetch = { workspace = true }
agentos-mcp = { workspace = true }
agentos-acp = { workspace = true }
agentos-agui = { workspace = true }
agentos-http = { workspace = true }
anyhow = { workspace = true }          # anyhow is allowed ONLY here (binary)
axum = { workspace = true }
axum-server = { workspace = true }     # TLS termination is wiring, so it lives here
futures-util = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "net"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
agentos-application = { workspace = true, features = ["testing"] }
rcgen = "0.14"
reqwest = { workspace = true }
rmcp = { workspace = true }
sha2 = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
