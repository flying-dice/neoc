[package]
name = "neoc-codegen-lua"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neoc-ast.workspace = true
neoc-macros.workspace = true

[dev-dependencies]
neoc-parser.workspace = true
neoc-types.workspace = true
# Behavioural spec: Gherkin features in `tooling/codegen-lua/` driven against
# `emit`. cucumber supplies its own runner (default libtest harness disabled
# below); `futures::executor::block_on` drives it so this pure crate stays
# tokio-free. `neoc-parser` (above) bridges source → AST for the features.
cucumber = "0.21.1"
futures = "0.3"

[[test]]
name = "cucumber"
harness = false

[lints]
workspace = true
