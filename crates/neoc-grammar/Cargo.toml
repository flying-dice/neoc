[package]
name = "neoc-grammar"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
tree-sitter-language.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter.workspace = true
# Behavioural spec: Gherkin features in `tooling/grammar/` driven against the
# tree-sitter parser. cucumber supplies its own runner (default libtest harness
# disabled below); `futures::executor::block_on` drives it so this leaf crate
# stays tokio-free.
cucumber = "0.21.1"
futures = "0.3"

[lints]
workspace = true

[[test]]
name = "cucumber"
harness = false
