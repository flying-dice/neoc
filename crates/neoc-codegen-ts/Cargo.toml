[package]
name = "neoc-codegen-ts"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neoc-ast.workspace = true
# The TypeScript backend is the typed consumer of the JavaScript backend's
# shared lowering core: it emits the same ES2022 runtime body (via
# `emit_with_style`) and the same neoc→TS projection (`project_*`/`ts_type`),
# then weaves the inline type declarations a self-typed `.ts` carries.
neoc-codegen-js.workspace = true

[dev-dependencies]
neoc-parser.workspace = true
# Behavioural spec: Gherkin features in `tooling/codegen-ts/` driven against
# `emit`. cucumber supplies its own runner (default libtest harness disabled
# below); `futures::executor::block_on` drives it so this pure leaf crate stays
# tokio-free, mirroring `neoc-codegen-js`'s harness.
cucumber = "0.21.1"
futures = "0.3"

[lints]
workspace = true

[[test]]
name = "cucumber"
harness = false
