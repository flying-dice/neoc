[package]
name = "neoc-vm-lib-hash"
description = "lib:hash"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_hash"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.13"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1"
md-5 = "0.11"
sha1 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
serde_json = "1"

[lints.cargo]
missing_lints_inheritance = "allow"
