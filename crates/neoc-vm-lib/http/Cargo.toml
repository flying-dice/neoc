[package]
name = "neoc-vm-lib-http"
description = "lib:http"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_http"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-vm-lib-glob = { workspace = true }
neoc-vm-std = { workspace = true }
neoc-vm-lib-json = { workspace = true }
neoc-net = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal", "fs"] }
# `lib:archive`, `lib:glob` and `lib:http`: iterative tree walks.
walkdir = "2"
tempfile = "3"
globset = "0.4"
bytes = "1"
parking_lot = { workspace = true }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `lib:http`'s server-sent events: the HTML standard's parser.
eventsource-stream = "0.2"

[dev-dependencies]
neoc-vm-std = { workspace = true, features = ["testing"] }
# the client's tests run their servers with hyper's
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[lints.cargo]
missing_lints_inheritance = "allow"
