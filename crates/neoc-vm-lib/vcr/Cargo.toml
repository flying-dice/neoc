[package]
name = "neoc-vm-lib-vcr"
description = "lib:vcr"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_vcr"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
parking_lot = "0.13"
serde_json = "1"
tempfile = "3"

[dev-dependencies]
neoc-vm-lib-base64 = { workspace = true }
neoc-vm-std = { workspace = true }

[lints.cargo]
missing_lints_inheritance = "allow"
