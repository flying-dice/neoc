[package]
name = "neoc-vm-lib-text"
description = "lib:text"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_text"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
strsim = "0.11"
heck = "0.5"
unicode-width = "0.2"
deunicode = "1"
vte = "0.14"
unicode-segmentation = "1"

[lints.cargo]
missing_lints_inheritance = "allow"
