[package]
name = "neoc-vm-lib-agui"
description = "lib:agui"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_agui"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-vm-vnd-hyper = { workspace = true }
# The AG-UI protocol (its types, the events of a run read from an SSE stream, JSON Patch): our own crate, with no I/O. The
# request is `vnd:hyper`'s client.
neoc-agui = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"

[lints.cargo]
missing_lints_inheritance = "allow"
