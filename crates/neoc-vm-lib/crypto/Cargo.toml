[package]
name = "neoc-vm-lib-crypto"
description = "lib:crypto"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_crypto"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
aes-gcm = "0.11"
chacha20poly1305 = "0.11"

[dev-dependencies]
neoc-vm-lib-hex = { workspace = true }
neoc-vm-lib-random = { workspace = true }

[lints.cargo]
missing_lints_inheritance = "allow"
