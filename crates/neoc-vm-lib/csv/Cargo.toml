[package]
name = "neoc-vm-lib-csv"
description = "lib:csv"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_csv"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-vm-std = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
parking_lot = "0.13"
futures = { version = "0.3", default-features = false, features = ["std"] }
csv = "1"

[dev-dependencies]
neoc-vm-std = { workspace = true, features = ["testing"] }

[lints.cargo]
missing_lints_inheritance = "allow"
