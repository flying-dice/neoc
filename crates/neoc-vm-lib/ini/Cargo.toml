[package]
name = "neoc-vm-lib-ini"
description = "lib:ini"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm_lib_ini"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
mlua-ir = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rust-ini = "0.21"

[lints.cargo]
missing_lints_inheritance = "allow"
