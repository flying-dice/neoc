[package]
name = "neoc-vm"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "1.2", features = ["parse", "display"] }
quick-xml = { version = "0.42", features = ["serialize"] }
tracing = "0.1"
tracing-core = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
mlua = { version = "0.12", features = ["luajit", "async", "send", "vendored", "serialize", "macros"] }
parking_lot = "0.13"
regex = "1"
base64 = "0.23"
# De-facto Rust standard for hex (cited in the lib:hex issue) and already in
# the tree transitively. Zero-dep, backs `lib:hex` alongside the base64 crate.
hex = "0.4"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1"
md-5 = "0.11"
sha1 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
# HMAC over the sha2 digests, backing `lib:hmac`. RustCrypto `hmac` 0.13 pairs
# with the `digest` 0.11 traits `sha2` already implements — no new digest
# backend, just the keyed construction. `subtle` gives the constant-time tag
# comparison (`verify`); hand-rolling that is the side-channel footgun the
# module exists to avoid. Both are RustCrypto crates already in the tree
# transitively via the digest stack.
hmac = "0.13"
subtle = "2"
# AEAD primitives backing `lib:crypto`. `aes-gcm` 0.11 ships Aes128Gcm /
# Aes256Gcm; `chacha20poly1305` 0.11 ships ChaCha20Poly1305. Both implement
# the `aead::Aead` trait we dispatch through, and verify the tag in constant
# time inside the crate. RustCrypto family — same maintainers and audit basis
# as the `hmac`/`sha2`/`subtle` crates already in the tree, though they pull
# their own AEAD primitive crates (aes, ghash, chacha20, poly1305) into the
# lockfile.
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
# Asymmetric signing/verification backing `lib:pkey` — the issue's cited
# RustCrypto `signature` ecosystem, one crate per algorithm family. All three
# share the `signature` 3.x Signer/Verifier traits and the `pkcs8` 0.11 /
# `spki` 0.8 encoding layer already in the tree transitively (pulled by `rsa`,
# itself a sqlx-mysql auth dependency):
#   ed25519-dalek — Ed25519, the modern default. `rand_core` + `digest` (the
#                   fallible `Generate` impl) for keygen off the
#                   same `SysRng` `lib:random` uses; `pkcs8`/`pem` for PKCS#8 +
#                   SPKI. Default `zeroize` stays on so secret keys wipe on drop.
#   p256          — ECDSA over NIST P-256. Default `ecdsa` + `sha256` give ES256
#                   (SHA-256 prehash); `pem` adds PEM on top of the default pkcs8.
#   rsa           — RSA-PSS and RSA-PKCS#1 v1.5 (`pkcs1v15` feature); PEM comes
#                   from `pkcs8`'s `pem` feature, the SHA-256 digest from `sha2`.
#                   0.10 is the constant-time rewrite: 0.9.x's RUSTSEC-2023-0071
#                   (Marvin timing side-channel in RSA sign) does not apply.
# `pkcs8`/`spki` (pinned to the in-tree versions) give the EncodePrivateKey /
# EncodePublicKey traits + their PEM emitters, used uniformly across all three.
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "rand_core", "digest"] }
p256 = { version = "0.14", features = ["pem"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
signature = "3"
pkcs8 = { version = "0.11", features = ["pem", "std"] }
spki = { version = "0.8", features = ["pem", "std"] }
flate2 = "1"
zstd = "0.14"
brotli = "9"
# Archive handling backing `lib:archive` (#11). `tar` is the de-facto Rust tar
# crate (same author as flate2); it operates on any `Read`/`Write`, so the
# gzip/zstd layer is composed from the flate2/zstd crates already above —
# `lib:archive` integrates compression internally rather than depending on
# `lib:compress` at the Rust level. `zip` reads/writes zip; `default-features
# = false` drops the optional codecs (bzip2, zstd-in-zip, AES) we don't expose,
# leaving DEFLATE (the universal zip method) via the in-tree flate2. zip 9's
# `deflate` feature would add flate2's zlib-rs backend (and change the bytes
# `lib:compress` emits through feature unification), so it names the two parts
# it is made of, minus zlib-rs: `deflate-flate2` and zopfli for the top levels.
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }
# CSPRNG (`SysRng`) backing `lib:random`. Default features pull in `getrandom`
# + `std_rng`, which is all we need.
rand = "0.10"
# UUID generation + parsing for `lib:random`. `v4` = random, `v7` = unix-ms
# timestamp ordered. `uuid` 1.x is already a transitive dep — features make
# it ours.
uuid = { version = "1", features = ["v4", "v7"] }
rust-ini = "0.21"
mime_guess = "2"
csv = "1"
semver = "1"
similar = "3"
url = "2"
percent-encoding = "2"
# Civil dates, times, IANA timezone conversion, RFC 3339 / strftime parse and
# format. Default features bundle the tzdb on Windows and read /usr/share/zoneinfo
# on Unix, plus detect the system zone — exactly what `lib:chrono` needs.
jiff = "1.0"
strsim = "0.11"
heck = "0.5"
unicode-width = "0.2"
deunicode = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
# `default-features = false` drops tera's `builtins` (chrono-backed `date`,
# `urlencode`, `slugify`, `json_encode`). The lib:template AC (`upper`,
# `lower`, `trim`, `length`, `join`, `replace`, …) is met by tera's
# always-on filter set, so keeping `builtins` out avoids dragging chrono +
# tz data just for date formatting. Scripts that need those helpers can use
# their dedicated library modules and chain results through filters.
# Held at 1.x on purpose: tera 2 rewrites the template language (no
# `json_encode`, `slice`, `concat`, `map`, `filter`, `as_str` filters or
# `get_env()`; `int`/`float` reject non-integers; unknown filters fail when the
# template compiles), so moving to it is a deliberate `lib:template` change, not
# a dependency bump.
tera = { version = "1.20", default-features = false }
walkdir = "2"

# `lib:args` parses script argv with clap's builder API (`Arg`, `Command`,
# `value_parser`) — the runtime arg-parser, not a CLI tree. `derive` is the
# binary's concern, so it stays out here.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
# `lib:glob` and `lib:http` match paths/hosts with globset.
globset = "0.4"

hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# sqlx is async-only and used here for `lib.mysql` / `lib.postgres`, where the
# work genuinely is network IO (worth yielding for). For `lib.sqlite` we use
# rusqlite directly — sqlite is a synchronous C library, so wrapping it in
# async/await machinery on top adds overhead with no IO to overlap. Both
# ultimately link the same vendored libsqlite3-sys.
# `mysql`/`postgres` are pure-Rust drivers; TLS is intentionally not enabled here
# (consistent with `lib.http` being HTTP-only).
# `mysql-rsa` keeps MySQL's `caching_sha2_password` working over a plain
# connection (sqlx 0.9 made the RSA key exchange opt-in; 0.8 always included it).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "mysql-rsa", "postgres"] }
rusqlite = { version = "0.43", features = ["bundled"] }

# JSON Schema validation. `default-features = false` drops the optional
# resolvers (HTTP/file remote $ref) — schemas embedded in scripts don't
# need them, and turning them off shrinks the dependency tree. `idna` is the
# one default feature kept: since 0.61 it backs the `idn-hostname` and
# `idn-email` formats, which silently pass anything without it.
jsonschema = { version = "0.61", default-features = false, features = ["idna"] }

# Exposed to Lua as `lib.testcontainers` so scripts (and our integration
# tests) can spin up disposable backing services without external setup.
testcontainers-modules = { version = "0.15", features = ["mysql", "postgres"] }

# RAII temp files and directories backing `lib:tempfile`. Rust's de-facto
# tempfile crate — `NamedTempFile` / `TempDir` unlink on drop, which is the
# semantic the Lua-facing UserData layer mirrors via mlua's GC.
tempfile = "3"

# Bounded LRU map backing `lib:cache` — the crate the issue (#46) names as the
# de-facto Rust standard (alongside `hashicorp/golang-lru` in Go). Provides the
# capacity-bounded recency map; per-entry TTL is layered on top in the module.
# Its only dependency is `hashbrown`, already in the tree transitively.
lru = "0.19"
# Unicode correctness primitives backing `lib:unicode` (#25). The three the
# issue names are unicode-rs crates already in the tree transitively, so this
# only promotes them to direct deps:
#   unicode-normalization — NFC/NFD/NFKC/NFKD via the `UnicodeNormalization`
#                           trait (`normalize`).
#   unicode-segmentation  — extended grapheme-cluster iteration, UAX #29
#                           (`graphemes`, `grapheme_count`).
#   unicode-properties    — `General_Category` lookup (`category`);
#                           `default-features = false` drops the emoji tables
#                           we don't surface.
# East-Asian display width (`width`) reuses the `unicode-width` dep already in
# the tree (it backs lib:text). Case-folding (`fold`, `caseless_eq`) is the gap
# the named three leave — they normalise and segment but none fold. `caseless`
# is the fourth unicode-rs sibling and the de-facto Rust crate for UAX #44
# default case folding + canonical caseless matching (Python `str.casefold`,
# Go `cases.Fold` parity); its only dependency is `unicode-normalization`
# above. Not on the blessed list — flagged for sign-off on #25.
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
caseless = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# Optional regular dep, gated behind the `bench` feature so it doesn't
# bloat normal lib builds. Lives in `[dependencies]` rather than
# `[dev-dependencies]` because the `pub fn benches` functions inline in
# `src/lua/lib/<module>.rs` need to reference `criterion::Criterion` from
# library code — and dev-dependencies aren't visible to lib code.
[dependencies.criterion]
version = "0.8"
features = ["html_reports"]
optional = true

[features]
# Compiles the per-module `benches` functions and pulls in criterion.
# `cargo bench` auto-activates this via the `[[bench]] required-features`
# entry below, so users don't have to remember the flag.
bench = ["dep:criterion"]

[[bench]]
name = "lib"
path = "benches/lib/lib.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "vnd"
path = "benches/vnd/vnd.rs"
harness = false
required-features = ["bench"]

# The root `[workspace.lints]` table (clippy pedantic, `unsafe_code = "deny"`) was
# imported with the old compiler crates and never inherited here: opting in
# today means ~700 pedantic findings and six `unsafe` blocks. Adopting it is its
# own change, so silence cargo's "missing lints inheritance" nag until then.
[lints.cargo]
missing_lints_inheritance = "allow"
