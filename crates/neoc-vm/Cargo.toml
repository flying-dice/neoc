[package]
name = "neoc-vm"
description = "neoc's Lua runtime, on mlua-ir: modules written once in Rust, declarations read from the schema"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-vm-std = { workspace = true }
neoc-vnd-bollard = { workspace = true }
neoc-vnd-hyper = { workspace = true }
neoc-vnd-jsonschema = { workspace = true }
neoc-vnd-keyring = { workspace = true }
neoc-vnd-portable_pty = { workspace = true }
neoc-vnd-quick_xml = { workspace = true }
neoc-vnd-rusqlite = { workspace = true }
neoc-vnd-serde_json = { workspace = true }
neoc-vnd-serde_yaml = { workspace = true }
neoc-vnd-sqlx_mysql = { workspace = true }
neoc-vnd-sqlx_postgres = { workspace = true }
neoc-vnd-testcontainers_modules = { workspace = true }
neoc-vnd-toml = { workspace = true }
neoc-lib-agui = { workspace = true }
neoc-lib-archive = { workspace = true }
neoc-lib-args = { workspace = true }
neoc-lib-base64 = { workspace = true }
neoc-lib-cache = { workspace = true }
neoc-lib-chrono = { workspace = true }
neoc-lib-compile = { workspace = true }
neoc-lib-compress = { workspace = true }
neoc-lib-crypto = { workspace = true }
neoc-lib-csv = { workspace = true }
neoc-lib-diff = { workspace = true }
neoc-lib-glob = { workspace = true }
neoc-lib-hash = { workspace = true }
neoc-lib-hex = { workspace = true }
neoc-lib-hmac = { workspace = true }
neoc-lib-html = { workspace = true }
neoc-lib-http = { workspace = true }
neoc-lib-ini = { workspace = true }
neoc-lib-json = { workspace = true }
neoc-lib-log = { workspace = true }
neoc-lib-mime = { workspace = true }
neoc-lib-pkey = { workspace = true }
neoc-lib-random = { workspace = true }
neoc-lib-regex = { workspace = true }
neoc-lib-semver = { workspace = true }
neoc-lib-tempfile = { workspace = true }
neoc-lib-template = { workspace = true }
neoc-lib-test = { workspace = true }
neoc-lib-text = { workspace = true }
neoc-lib-unicode = { workspace = true }
neoc-lib-url = { workspace = true }
neoc-lib-vcr = { workspace = true }
mlua-ir = { workspace = true }
mlua-ir-gen = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "signal", "fs"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tracing-core = "0.1"

[lints.cargo]
missing_lints_inheritance = "allow"
