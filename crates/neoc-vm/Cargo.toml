[package]
name = "neoc-vm"
description = "neoc's Lua runtime, on mlua-ir: modules written once in Rust, declarations read from the schema"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "neoc_vm"
path = "src/lib.rs"

[dependencies]
neoc-vm-core = { workspace = true }
neoc-vm-std = { workspace = true }
neoc-lib-archive = { workspace = true }
neoc-lib-args = { workspace = true }
neoc-lib-base64 = { workspace = true }
neoc-lib-cache = { workspace = true }
neoc-lib-chrono = { workspace = true }
neoc-lib-compile = { workspace = true }
neoc-lib-compress = { workspace = true }
neoc-lib-crypto = { workspace = true }
neoc-lib-csv = { workspace = true }
neoc-lib-diff = { workspace = true }
neoc-lib-glob = { workspace = true }
neoc-lib-hash = { workspace = true }
neoc-lib-hex = { workspace = true }
neoc-lib-hmac = { workspace = true }
neoc-lib-html = { workspace = true }
neoc-lib-http = { workspace = true }
neoc-lib-ini = { workspace = true }
neoc-lib-json = { workspace = true }
neoc-lib-log = { workspace = true }
neoc-lib-mime = { workspace = true }
neoc-lib-pkey = { workspace = true }
neoc-lib-random = { workspace = true }
neoc-lib-regex = { workspace = true }
neoc-lib-semver = { workspace = true }
neoc-lib-tempfile = { workspace = true }
neoc-lib-template = { workspace = true }
neoc-lib-test = { workspace = true }
neoc-lib-text = { workspace = true }
neoc-lib-unicode = { workspace = true }
neoc-lib-url = { workspace = true }
neoc-lib-vcr = { workspace = true }
mlua-ir = { workspace = true }
mlua-ir-gen = { workspace = true }
# The engine is Luau.
mlua = { version = "0.12", features = ["luau", "async", "send", "serialize", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "signal", "fs"] }
parking_lot = "0.13"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = { version = "0.42", features = ["serialize"] }
jsonschema = { version = "0.61", default-features = false, features = ["idna"] }
toml = { version = "1.2", features = ["parse", "display"] }
url = "2"
# `std:fs` stages a cross-device move beside its destination; `lib:tempfile` is this crate.
tempfile = "3"
# `vnd:hyper`. `client-legacy` for its `HttpConnector`: name lookup and Happy Eyeballs (RFC 8305)
# for the client's TCP connect. TLS is rustls over the `ring` provider with the platform certificate verifier.
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
tower-service = "0.3"
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
bytes = "1"
# `vnd:rusqlite`: SQLite, with its own libsqlite3 built in.
rusqlite = { version = "0.43", features = ["bundled"] }
# `vnd:sqlx_mysql` and `vnd:sqlx_postgres`: pure-Rust drivers, without TLS (only `vnd:hyper` carries a TLS stack).
# `mysql-rsa` keeps MySQL's `caching_sha2_password` working over a plain connection.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa", "postgres"] }
# `vnd:keyring`: the operating system's credential store. `keyring` (its default `v1` feature) picks
# the platform's store and opens it: Keychain Services on macOS, the Credential Manager on Windows, the Secret
# Service on the other Unixes (over zbus, with RustCrypto for the session: no libdbus and no OpenSSL to link).
# `keyring-core` is the crate it is built on, named for what `keyring` does not re-export: entries in a given store,
# `search`, and the mock store the tests (and `NEOC_KEYRING=mock`) use.
keyring = "4.2"
keyring-core = "1.1"
# `vnd:portable_pty`: the pseudo-terminal layer of WezTerm (openpty on Unix, ConPTY on Windows). Its
# reader, writer and child wait are blocking, so the module runs each on a thread of its own.
portable-pty = "0.9"
# `vnd:bollard`: the Docker Engine API client. Already in the tree through testcontainers (the same
# version, and the features it turns on: `ssl` is rustls over `ring`), so this only names the dependency. `time`
# makes its dates `time::OffsetDateTime` (testcontainers turns it on too), which `time` writes back as RFC 3339.
bollard = { version = "0.20", features = ["ssl", "time"] }
time = { version = "0.3", default-features = false, features = ["formatting"] }
# `vnd:testcontainers_modules`: disposable MySQL, Postgres and any other image, in Docker.
testcontainers-modules = { version = "0.15", features = ["mysql", "postgres"] }

# `lib:agui`: the AG-UI protocol (its types, the events of a run read from an SSE stream, JSON Patch). Our own crate
# (`crates/neoc-agui`), with no I/O: the request is `vnd:hyper`'s client.
neoc-agui = { path = "../neoc-agui" }

[dev-dependencies]
neoc-vm-std = { workspace = true, features = ["testing"] }
tracing-core = "0.1"
# a self-signed certificate for the `vnd:hyper` TLS tests
rcgen = "0.14"

[lints.cargo]
missing_lints_inheritance = "allow"
