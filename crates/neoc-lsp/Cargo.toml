[package]
name = "neoc-lsp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neoc-compiler.workspace = true
neoc-grammar.workspace = true
neoc-parser.workspace = true
neoc-types.workspace = true
tree-sitter.workspace = true
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt", "io-std", "io-util", "macros"] }
# `completionItem/resolve` round-trips the document URI through the item's
# `data` field, which is a `serde_json::Value`.
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
cucumber = "0.21.1"
# The IDE-UX spec inspects the LSP types the handlers return (e.g. a resolved
# completion's `Documentation`); the harness is a separate crate from the lib.
tower-lsp = "0.20"

# IDE-UX spec: Gherkin features in `tooling/ide/` driven against the real
# handlers. cucumber supplies its own runner, so the default libtest harness is
# disabled. `cargo test --workspace` (CI) runs it; the features are the spec.
[[test]]
name = "cucumber"
harness = false
