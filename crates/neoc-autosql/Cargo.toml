[package]
name = "neoc-autosql"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# SQL parser. A pure-Rust parsing crate (no host-runtime I/O), the same
# category as tree-sitter in neoc-parser — not a runtime dependency. autosql
# emits portable `.neoc`; nothing here couples to a runtime target. The
# `visitor` feature gives us a whole-statement expression walk, used to count
# bind placeholders across every clause.
sqlparser = { version = "0.52", features = ["visitor"] }
thiserror = "2"

[dev-dependencies]
# Round-trips the generated `.neoc` through the real compiler — proving the
# emitted source type-checks and lowers to both Lua and JS. Dev-only: the
# generator does not depend on the compiler.
neoc-compiler.workspace = true
# Behavioural spec: Gherkin features in `tooling/autosql/` driven against
# `generate_project`. cucumber supplies its own runner (default libtest harness
# disabled below); `futures::executor::block_on` drives it so this pure crate
# stays tokio-free. `tempfile` writes a throwaway SQL project tree per scenario.
cucumber = "0.21.1"
futures = "0.3"
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "cucumber"
harness = false
