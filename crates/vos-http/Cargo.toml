[package]
name = "vos-http"
description = "Adapter: axum. /rpc JSON-RPC-over-WebSocket peer (+ Origin/Host guard) and static serving of the built client."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[dependencies]
vos-application = { workspace = true }
vos-domain = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
gethostname = { workspace = true }
if-addrs = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
vos-application = { workspace = true, features = ["testing"] }
tokio-tungstenite = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
