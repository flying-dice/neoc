[package]
name = "agentos-acp"
description = "Adapter: ACP client (agent-client-protocol) that launches agents over stdio; implements AgentConnector."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
agentos-application = { workspace = true }
agentos-domain = { workspace = true }
agent-client-protocol = { workspace = true, features = ["process", "stdio"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util = { workspace = true, features = ["compat"] }

[lints]
workspace = true
