[package]
name = "agentos-acp"
description = "Adapter: ACP client (agent-client-protocol) that launches agents over stdio; implements AgentConnector."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[dependencies]
agentos-application = { workspace = true }
agentos-domain = { workspace = true }
agent-client-protocol = { workspace = true, features = ["process", "stdio"] }
async-trait = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt"] }

[lints]
workspace = true
