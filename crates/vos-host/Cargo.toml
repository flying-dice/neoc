[package]
name = "vos-host"
description = "Composition root: the only crate that knows every adapter. Wires adapters into the application and serves."
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish.workspace = true

# the host binary is `vos` (the crate keeps the hexagon's `vos-<role>` naming)
[[bin]]
name = "vos"
path = "src/main.rs"

[dependencies]
vos-domain = { workspace = true }
vos-application = { workspace = true }
vos-lua = { workspace = true }
vos-sqlite = { workspace = true }
vos-fetch = { workspace = true }
vos-mcp = { workspace = true }
vos-acp = { workspace = true }
vos-agui = { workspace = true }
vos-http = { workspace = true }
anyhow = { workspace = true }          # anyhow is allowed ONLY here (binary)
async-trait = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }     # TLS termination is wiring, so it lives here
futures-util = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "net"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
vos-application = { workspace = true, features = ["testing"] }
rcgen = "0.14"
reqwest = { workspace = true, features = ["http2"] }
rmcp = { workspace = true }
sha2 = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
