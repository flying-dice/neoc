stages:
  - lint
  - test
  - build
  - release
  - pages

image: rust:1-bookworm

default:
  before_script:
    - rustup component add rustfmt clippy

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Keep all cargo data inside the project dir so it lands in the cache.
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

# ── Cache anchors ─────────────────────────────────────────────────────────────

# Shared registry / git / bin cache — keyed by a manual version string so it
# can be busted when tool versions need to change (bump tools-vN).
.tools_cache: &tools_cache
  key: tools-v3
  paths:
    - .cargo/bin/
    - .cargo/registry/
    - .cargo/git/

# ── lint ──────────────────────────────────────────────────────────────────────

lint:
  stage: lint
  cache:
    - *tools_cache
    - key:
        files: [Cargo.lock]
        prefix: lint
      paths:
        - target/
  script:
    - cargo fmt --check
    - cargo clippy --all-targets

# ── test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  needs: [lint]
  cache:
    - *tools_cache
    - key:
        files: [Cargo.lock]
        prefix: test
      paths:
        - target/
  script:
    - cargo build
    - cargo test --lib
    - cargo test --bin neoc
    # Docker-dependent tests (sqlx_mysql, sqlx_postgres, testcontainers_modules)
    # require a live Docker daemon and are excluded from the runner.
    - |
      cargo run -- \
        "tests/lib/*.test.luau" \
        "tests/std/*.test.luau" \
        "tests/vnd/jsonschema.test.luau" \
        "tests/vnd/quick_xml.test.luau" \
        "tests/vnd/rusqlite.test.luau" \
        "tests/vnd/serde_json.test.luau" \
        "tests/vnd/serde_yaml.test.luau" \
        "tests/vnd/toml.test.luau"

# ── build ─────────────────────────────────────────────────────────────────────
#
# Build jobs are independent of the test stage so that binaries are always
# produced for every commit — even on WIP branches where tests may be
# intentionally failing. Check the lint/test jobs separately for quality gates.
#
# Cross-compilation uses rustup target add + plain cargo build. Each job
# installs the appropriate system linker from apt.

# Native Linux x86_64 — plain cargo, no cross toolchain needed.
build:linux-x86_64:
  stage: build
  cache:
    - *tools_cache
    - key:
        files: [Cargo.lock]
        prefix: build-x86_64-linux-gnu
      paths:
        - target/
  script:
    - cargo build --release
    - mkdir -p artifacts
    - strip target/release/neoc
    - cp target/release/neoc artifacts/neoc-x86_64-unknown-linux-gnu
  artifacts:
    name: "neoc-x86_64-unknown-linux-gnu-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/
    expire_in: 14 days

# Static Linux x86_64 — fully self-contained, no glibc dependency.
build:linux-x86_64-musl:
  stage: build
  variables:
    TARGET: x86_64-unknown-linux-musl
    CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  cache:
    - *tools_cache
    - key:
        files: [Cargo.lock]
        prefix: build-x86_64-linux-musl
      paths:
        - target/
  script:
    - apt-get update -qq && apt-get install -y -qq musl-tools
    - rustup target add "${TARGET}"
    - cargo build --release --target "${TARGET}"
    - mkdir -p artifacts
    - strip "target/${TARGET}/release/neoc"
    - cp "target/${TARGET}/release/neoc" "artifacts/neoc-${TARGET}"
  artifacts:
    name: "neoc-${TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/
    expire_in: 14 days

# Linux ARM64 — cross-compiled for aarch64 servers and Raspberry Pi 4+.
build:linux-aarch64:
  stage: build
  variables:
    TARGET: aarch64-unknown-linux-gnu
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  cache:
    - *tools_cache
    - key:
        files: [Cargo.lock]
        prefix: build-aarch64-linux-gnu
      paths:
        - target/
  script:
    - apt-get update -qq && apt-get install -y -qq gcc-aarch64-linux-gnu
    - rustup target add "${TARGET}"
    - cargo build --release --target "${TARGET}"
    - mkdir -p artifacts
    - cp "target/${TARGET}/release/neoc" "artifacts/neoc-${TARGET}"
  artifacts:
    name: "neoc-${TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/
    expire_in: 14 days

# Windows x86_64 — cross-compiled via MinGW.
build:windows-x86_64:
  stage: build
  variables:
    TARGET: x86_64-pc-windows-gnu
    CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
  cache:
    - *tools_cache
    - key:
        files: [Cargo.lock]
        prefix: build-x86_64-windows-gnu
      paths:
        - target/
  script:
    - apt-get update -qq && apt-get install -y -qq mingw-w64
    - rustup target add "${TARGET}"
    - cargo build --release --target "${TARGET}"
    - mkdir -p artifacts
    - cp "target/${TARGET}/release/neoc.exe" "artifacts/neoc-${TARGET}.exe"
  artifacts:
    name: "neoc-${TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/
    expire_in: 14 days

# ── release ───────────────────────────────────────────────────────────────────
#
# release-plz runs on every push to main. It has two responsibilities:
#   1. release-plz release    — if the version in Cargo.toml has no matching
#                               tag yet (i.e. the Release MR was just merged),
#                               push the tag and create the GitLab Release with
#                               the generated changelog as its description.
#   2. release-plz release-pr — create or update a Release MR that bumps the
#                               version and updates CHANGELOG.md based on
#                               conventional commits since the last release.
#
# Merging the Release MR is the approval gate. Once merged, release-plz pushes
# the tag and creates the release; the tag pipeline then builds and attaches
# binaries automatically.
#
# Requires GITLAB_TOKEN (a PAT or Project Access Token with api +
# write_repository scopes) stored as a masked CI/CD variable.
#
# upload-release-assets and attach-release-assets run only on version tags
# (v*.*.*). upload pushes binaries to the Generic Package Registry for permanent
# URLs; attach adds those links to the release-plz-created GitLab Release.

release-plz:
  stage: release
  # Uses the default rust:1-bookworm image — release-plz needs cargo to read
  # Cargo.toml metadata. The binary is downloaded and cached in CARGO_HOME/bin.
  #
  # GIT_DEPTH: 0 — full clone so release-plz can see all tags and compute the
  # correct next version. The default shallow depth of 20 hides older tags.
  #
  # git checkout — GitLab CI checks out in detached HEAD; release-plz requires
  # HEAD to point to a branch so it can determine the current branch name.
  variables:
    GIT_DEPTH: 0
  before_script:
    - git checkout "$CI_COMMIT_BRANCH"
    - mkdir -p "$CARGO_HOME/bin"
    - export PATH="$CARGO_HOME/bin:$PATH"
    - |
      which release-plz 2>/dev/null || \
        curl -sSL \
          "https://github.com/release-plz/release-plz/releases/latest/download/release-plz-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C "$CARGO_HOME/bin/"
  cache:
    - *tools_cache
  script:
    - release-plz release --git-token "$RELEASE_PLZ_TOKEN" --forge gitlab
    - release-plz release-pr --git-token "$RELEASE_PLZ_TOKEN" --forge gitlab
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

upload-release-assets:
  stage: release
  image: curlimages/curl:latest
  before_script: []
  needs:
    - build:linux-x86_64
    - build:linux-x86_64-musl
    - build:linux-aarch64
    - build:windows-x86_64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - |
      for f in artifacts/neoc-*; do
        fname=$(basename "$f")
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/neoc/$CI_COMMIT_TAG/$fname"
        echo "Uploaded $fname"
      done

attach-release-assets:
  stage: release
  image: curlimages/curl:latest
  before_script: []
  needs:
    - upload-release-assets
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - |
      PKG_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/neoc/$CI_COMMIT_TAG"
      LINKS_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links"
      add_link() {
        curl --fail --silent --show-error \
          --request POST \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --data "name=$1&url=$2&link_type=package" \
          "$LINKS_URL"
        echo "Linked $1"
      }
      add_link "neoc-x86_64-unknown-linux-gnu"   "$PKG_BASE/neoc-x86_64-unknown-linux-gnu"
      add_link "neoc-x86_64-unknown-linux-musl"  "$PKG_BASE/neoc-x86_64-unknown-linux-musl"
      add_link "neoc-aarch64-unknown-linux-gnu"  "$PKG_BASE/neoc-aarch64-unknown-linux-gnu"
      add_link "neoc-x86_64-pc-windows-gnu.exe"  "$PKG_BASE/neoc-x86_64-pc-windows-gnu.exe"

# ── pages ─────────────────────────────────────────────────────────────────────
#
# Builds the VitePress documentation site and publishes it via GitLab Pages.
# Runs only on the default branch. The `public/` artifact is the GitLab Pages
# contract — its root becomes the served site.
#
# If GitLab Pages serves the site at a subpath (e.g. /neoc/) rather than the
# domain root, set the VITEPRESS_BASE CI/CD variable in project settings:
#   Settings → CI/CD → Variables → VITEPRESS_BASE = /neoc/

pages:
  stage: pages
  image: oven/bun:latest
  before_script: []
  needs: []
  variables:
    VITEPRESS_BASE: /flying-dice/neoc/
  script:
    - cd docs
    - bun install --frozen-lockfile
    - bun run docs:build
    - cd ..
    - mkdir -p public
    - cp -r docs/.vitepress/dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
