stages:
  - lint
  - test
  - build
  - release
  - pages

image: rust:1-bookworm

default:
  before_script:
    - rustup component add rustfmt clippy

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Keep all cargo data inside the project dir so it lands in the cache.
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  # The neoc-grammar crate compiles the `tree-sitter-neoc` submodule's
  # parser.c. `.gitmodules` uses a relative URL (`../tree-sitter-neoc.git`) so
  # the CI job token can clone it; fetch it before any build/lint job runs.
  GIT_SUBMODULE_STRATEGY: recursive

# ── Cache anchors ─────────────────────────────────────────────────────────────

# Shared registry / git / bin cache — keyed by a manual version string so it
# can be busted when tool versions need to change (bump tools-vN).
.tools_cache: &tools_cache
  key: tools-v3
  paths:
    - .cargo/bin/
    - .cargo/registry/
    - .cargo/git/

# ── lint ──────────────────────────────────────────────────────────────────────

lint:
  stage: lint
  cache:
    - *tools_cache
    - key: lint-target
      paths:
        - target/
  script:
    - cargo fmt --check
    - cargo clippy --all-targets

# ── test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  needs: [lint]
  cache:
    - *tools_cache
    - key: test-target
      paths:
        - target/
  script:
    - cargo build
    # Full workspace suite: runtime lib/bin tests plus the compiler's
    # integration tests (conformance.rs/_static/_syntax, cli.rs, LSP). The
    # conformance exec arms self-skip when lua/node/rustc are absent on the
    # runner via a binary_present gate, so no toolchain installs are needed.
    - cargo test --workspace
    # Docker-dependent tests (sqlx_mysql, sqlx_postgres, testcontainers_modules)
    # require a live Docker daemon and are excluded from the runner.
    - |
      cargo run -p neoc -- run \
        "crates/neoc/tests/lib/*.test.luau" \
        "crates/neoc/tests/std/*.test.luau" \
        "crates/neoc/tests/vnd/jsonschema.test.luau" \
        "crates/neoc/tests/vnd/quick_xml.test.luau" \
        "crates/neoc/tests/vnd/rusqlite.test.luau" \
        "crates/neoc/tests/vnd/serde_json.test.luau" \
        "crates/neoc/tests/vnd/serde_yaml.test.luau" \
        "crates/neoc/tests/vnd/toml.test.luau"

# ── wasm ──────────────────────────────────────────────────────────────────────
#
# The pure transform crates must stay host-free so the browser build remains
# viable. They are checked for wasm32-unknown-unknown here. The parser/compiler
# graph currently links the tree-sitter C runtime, which does not yet
# cross-compile to wasm32-unknown-unknown; making that graph wasm-clean (cc to
# wasm, or a pure-Rust parser) is tracked separately. Until then the gate
# guards the leaf crates, which is where host-dependency creep would start.

wasm:
  stage: test
  needs: [lint]
  cache:
    - *tools_cache
    - key: wasm-target
      paths:
        - target/
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo check --target wasm32-unknown-unknown -p neoc-ast -p neoc-macros -p neoc-codegen-lua -p neoc-codegen-luau -p neoc-codegen-ts -p neoc-codegen-python

# ── typecheck ─────────────────────────────────────────────────────────────────
#
# Guards the headline of the self-typed targets: the emitted TypeScript must be
# `tsc --strict`-clean and the emitted Python pyright-clean (#81). Scoped to the
# example packages — the root `tsconfig.json` has no `exclude`, so a whole-repo
# `tsc` would also see the conformance `.ts` snippets (runtime samples, not
# meant to type-check). Runs on the bun image; `bun install` provides
# `@types/bun` for the host adapter, and pyright runs from the package dir so
# its `pyrightconfig.json` (pythonVersion + auto path) applies. `typescript` and
# `pyright` are pinned in `package.json` and resolved from the frozen lockfile,
# so a new upstream release can't silently drift the gate.
typecheck:
  stage: test
  needs: [lint]
  image: oven/bun:latest
  before_script: []
  script:
    - bun install --frozen-lockfile
    - bunx tsc --noEmit -p packages/bun-http-sqlite-ts/tsconfig.json
    - cd packages/python-http-sqlite && bunx pyright src

# ── build ─────────────────────────────────────────────────────────────────────
#
# Build jobs are independent of the test stage so that binaries are always
# produced for every commit — even on WIP branches where tests may be
# intentionally failing. Check the lint/test jobs separately for quality gates.
#
# Cross-compilation uses rustup target add + plain cargo build. Each job
# installs the appropriate system linker from apt.

# Native Linux x86_64 — plain cargo, no cross toolchain needed.
build:linux-x86_64:
  stage: build
  cache:
    - *tools_cache
    - key: build-x86_64-linux-gnu-target
      paths:
        - target/
  script:
    - cargo build --release
    - mkdir -p artifacts
    - strip target/release/neoc
    - cp target/release/neoc artifacts/neoc-x86_64-unknown-linux-gnu
  artifacts:
    name: "neoc-x86_64-unknown-linux-gnu-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/
    expire_in: 14 days

# Windows x86_64 — cross-compiled via MinGW.
build:windows-x86_64:
  stage: build
  variables:
    TARGET: x86_64-pc-windows-gnu
    CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
  cache:
    - *tools_cache
    - key: build-x86_64-windows-gnu-target
      paths:
        - target/
  script:
    - apt-get update -qq && apt-get install -y -qq mingw-w64
    - rustup target add "${TARGET}"
    - cargo build --release --target "${TARGET}"
    - mkdir -p artifacts
    - cp "target/${TARGET}/release/neoc.exe" "artifacts/neoc-${TARGET}.exe"
  artifacts:
    name: "neoc-${TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - artifacts/
    expire_in: 14 days

# ── release ───────────────────────────────────────────────────────────────────
#
# release-plz runs on every push to main. It has two responsibilities:
#   1. release-plz release    — if the version in Cargo.toml has no matching
#                               tag yet (i.e. the Release MR was just merged),
#                               push the tag and create the GitLab Release with
#                               the generated changelog as its description.
#   2. release-plz release-pr — create or update a Release MR that bumps the
#                               version and updates CHANGELOG.md based on
#                               conventional commits since the last release.
#
# Merging the Release MR is the approval gate. Once merged, release-plz pushes
# the tag and creates the release; the tag pipeline then builds and attaches
# binaries automatically.
#
# Requires GITLAB_TOKEN (a PAT or Project Access Token with api +
# write_repository scopes) stored as a masked CI/CD variable.
#
# upload-release-assets and attach-release-assets run only on version tags
# (v*.*.*). upload pushes binaries to the Generic Package Registry for permanent
# URLs; attach adds those links to the release-plz-created GitLab Release.

release-plz:
  stage: release
  # Uses the default rust:1-bookworm image — release-plz needs cargo to read
  # CARGO_HOME is set to /tmp so that cargo's registry and the release-plz
  # binary land outside the project directory. The project dir must be clean
  # (no untracked files) for release-plz to compute the next version.
  #
  # GIT_DEPTH: 0 — full clone so release-plz can see all tags.
  # git checkout — CI checks out detached HEAD; release-plz needs a branch ref.
  dependencies: []
  variables:
    GIT_DEPTH: 0
    CARGO_HOME: /tmp/cargo
  before_script:
    # -B resets the branch to HEAD so a stale local branch ref on the reused
    # runner workspace can't shadow the fresh commit GitLab just checked out.
    - git checkout -B "$CI_COMMIT_BRANCH"
    # release-plz pushes the release MR branch over HTTPS; inject the PAT into
    # the remote URL so git push is authenticated.
    - git remote set-url origin "https://oauth2:${RELEASE_PLZ_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # release-plz creates commits on the release MR branch — needs an identity.
    - git config user.email "${RELEASE_PLZ_BOT_EMAIL}"
    - git config user.name "release-plz"
    - mkdir -p "$CARGO_HOME/bin"
    - export PATH="$CARGO_HOME/bin:$PATH"
    # Pinned to v0.3.157 — v0.3.158 breaks check_publish_fields for
    # publish=false workspaces. https://github.com/release-plz/release-plz/issues/2693
    - |
      curl -sSL \
        "https://github.com/release-plz/release-plz/releases/download/release-plz-v0.3.157/release-plz-x86_64-unknown-linux-gnu.tar.gz" \
        | tar -xz -C "$CARGO_HOME/bin/"
  script:
    - release-plz release --git-token "$RELEASE_PLZ_TOKEN" --forge gitlab
    - release-plz release-pr --git-token "$RELEASE_PLZ_TOKEN" --forge gitlab
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

upload-release-assets:
  stage: release
  image: curlimages/curl:latest
  before_script: []
  needs:
    - build:linux-x86_64
    - build:windows-x86_64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - |
      for f in artifacts/neoc-*; do
        fname=$(basename "$f")
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/neoc/$CI_COMMIT_TAG/$fname"
        echo "Uploaded $fname"
      done

attach-release-assets:
  stage: release
  image: curlimages/curl:latest
  before_script: []
  needs:
    - upload-release-assets
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - |
      PKG_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/neoc/$CI_COMMIT_TAG"
      LINKS_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG/assets/links"
      add_link() {
        curl --fail --silent --show-error \
          --request POST \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --data "name=$1&url=$2&link_type=package" \
          "$LINKS_URL"
        echo "Linked $1"
      }
      add_link "neoc-x86_64-unknown-linux-gnu"  "$PKG_BASE/neoc-x86_64-unknown-linux-gnu"
      add_link "neoc-x86_64-pc-windows-gnu.exe" "$PKG_BASE/neoc-x86_64-pc-windows-gnu.exe"

# ── pages ─────────────────────────────────────────────────────────────────────
#
# Builds the VitePress documentation site and publishes it to GitLab Pages.
#
# Deploys from ANY branch to the single Pages site at the root. Parallel /
# per-branch deployments aren't honoured on this instance (it ignores
# `path_prefix`), so there is one site and the most recent pipeline wins —
# fine in practice, few branches are ever in flight at once. VITEPRESS_BASE is
# the project's Pages root path; adjust it if that path changes.

pages:
  stage: pages
  image: oven/bun:latest
  before_script: []
  needs: []
  variables:
    VITEPRESS_BASE: /flying-dice/neoc/
  script:
    - cd docs
    - bun install --frozen-lockfile
    - bun run docs:build
    - cd ..
    - mkdir -p public
    - cp -r docs/.vitepress/dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH

# Posts the live docs URL into the branch's MR thread, so the GitLab → Slack
# integration relays the link to Slack. Resolves the MR from the branch name
# via glab. Needs PAGES_NOTIFY_TOKEN — a non-protected Project/Personal Access
# Token with `api` scope (must be non-protected so it's exposed on feature
# branches; RELEASE_PLZ_TOKEN is protected and won't be). Skipped (not failed)
# when the token is absent, so Pages still deploys without it.
#
# A notification is a side-effect — `allow_failure: true` so a glab error (e.g.
# the branch has no MR yet, the standard push-before-MR flow) never gates CI.
pages:notify:
  stage: pages
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script: []
  needs: ["pages"]
  allow_failure: true
  variables:
    GITLAB_HOST: "$CI_SERVER_HOST"
    GITLAB_TOKEN: "$PAGES_NOTIFY_TOKEN"
  script:
    - |
      glab mr note "$CI_COMMIT_REF_NAME" -m "📖 Docs deployed → ${CI_PAGES_URL}/ (${CI_COMMIT_SHORT_SHA})"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH && $PAGES_NOTIFY_TOKEN
