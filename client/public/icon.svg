<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The vos icon: a window and the Dock on the desktop's wallpaper. The source of icon-512.png, icon-192.png and
       apple-touch-icon.png (this file drawn at 512, 192 and 180 pixels). A full square: a home screen rounds the
       corners itself, and everything drawn is inside the middle 80% (the safe zone of a maskable icon). -->
  <defs>
    <radialGradient id="a" cx="0.1" cy="0" r="1"><stop offset="0" stop-color="#6e8efb"/><stop offset="0.6" stop-color="#6e8efb" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx="1" cy="0.1" r="0.9"><stop offset="0" stop-color="#c471ed"/><stop offset="0.6" stop-color="#c471ed" stop-opacity="0"/></radialGradient>
    <radialGradient id="c" cx="0.8" cy="1" r="0.95"><stop offset="0" stop-color="#f7797d"/><stop offset="0.6" stop-color="#f7797d" stop-opacity="0"/></radialGradient>
    <radialGradient id="d" cx="0" cy="1" r="0.9"><stop offset="0" stop-color="#12c2e9"/><stop offset="0.65" stop-color="#12c2e9" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.88"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="#2a2d6b"/>
  <rect width="512" height="512" fill="url(#a)"/>
  <rect width="512" height="512" fill="url(#b)"/>
  <rect width="512" height="512" fill="url(#c)"/>
  <rect width="512" height="512" fill="url(#d)"/>
  <!-- the window -->
  <rect x="112" y="118" width="288" height="204" rx="40" fill="#1b1d4a" fill-opacity="0.18" transform="translate(0 10)"/>
  <rect x="112" y="118" width="288" height="204" rx="40" fill="url(#glass)"/>
  <circle cx="156" cy="160" r="11" fill="#2a2d6b" fill-opacity="0.3"/>
  <circle cx="190" cy="160" r="11" fill="#2a2d6b" fill-opacity="0.3"/>
  <circle cx="224" cy="160" r="11" fill="#2a2d6b" fill-opacity="0.3"/>
  <!-- the Dock -->
  <rect x="160" y="346" width="192" height="60" rx="24" fill="#fff" fill-opacity="0.32"/>
  <rect x="178" y="360" width="32" height="32" rx="10" fill="#fff"/>
  <rect x="240" y="360" width="32" height="32" rx="10" fill="#fff"/>
  <rect x="302" y="360" width="32" height="32" rx="10" fill="#fff"/>
</svg>
