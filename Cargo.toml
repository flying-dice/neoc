[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# neoc's crates and AgentOS's crates share the repository. The neoc crates are edition 2024; the AgentOS crates
# keep edition 2021 (set per crate) until they move deliberately.
edition = "2024"
version = "0.1.0"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flying-dice/neoc"
publish = false

# One place for versions. Crates say `tokio = { workspace = true }` and add features only if they need more.
[workspace.dependencies]
neoc-vm = { path = "crates/neoc-vm" }
# internal (path deps; the arrows in the dependency diagram)
vos-domain      = { path = "crates/vos-domain" }
vos-application = { path = "crates/vos-application" }
vos-lua        = { path = "crates/vos-lua" }
vos-sqlite      = { path = "crates/vos-sqlite" }
vos-fetch       = { path = "crates/vos-fetch" }
vos-mcp         = { path = "crates/vos-mcp" }
vos-acp         = { path = "crates/vos-acp" }
vos-agui        = { path = "crates/vos-agui" }
vos-http        = { path = "crates/vos-http" }
# external
anyhow      = "1.0"
async-trait = "0.1"
notify      = "8.2"
parking_lot = "0.12"
rusqlite    = { version = "0.43.0", features = ["bundled", "hooks", "limits"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
thiserror   = "2"
axum        = { version = "0.8.9", features = ["ws", "macros"] }
rmcp        = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
tokio-util  = "0.7"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
getrandom   = "0.4"
if-addrs    = "0.15"
gethostname = "1"
toml        = { version = "1", default-features = false, features = ["parse", "serde"] }
ts-rs       = { version = "12.0.1", features = ["serde-json-impl"] }
schemars    = "1.2.3"
tower-http  = { version = "0.6.11", features = ["fs", "set-header", "trace"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
agent-client-protocol = { version = "5.3.0", default-features = false }
reqwest     = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio       = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"          # an adapter that truly needs unsafe opts out locally with a comment
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"            # tests opt out via clippy.toml (allow-unwrap-in-tests)
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# new in clippy 1.100's pedantic group: `assert!(x.is_empty())` is the idiom for the AgentOS tests; the lint's
# `assert_eq!(x, [] as [T; 0])` needs a type annotation on every site
assert_is_empty = "allow"

# neoc's release build (the `neoc` CLI): thin LTO, symbols stripped.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The AgentOS host: one small self-contained binary. `bun start` builds and runs it with
# `cargo run --profile release-host -p vos-host`.
[profile.release-host]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# mlua-sys builds Luau's C++ in its build script, with this package's opt level. At `opt-level = 0` a dev build runs
# the VM about 3 times slower (a 5e7-iteration numeric loop: 0.83 s against 0.28 s), where the LuaJIT it replaced was
# always built optimised, so build the engine optimised even in a dev build. (This is the package's own Rust code as
# well, a few small functions.)
[profile.dev.package.mlua-sys]
opt-level = 2
