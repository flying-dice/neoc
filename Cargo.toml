[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

# One place for versions. Crates say `tokio = { workspace = true }` and add features only if they need more.
[workspace.dependencies]
# internal (path deps; the arrows in the dependency diagram)
agentos-domain      = { path = "crates/agentos-domain" }
agentos-application = { path = "crates/agentos-application" }
agentos-luau        = { path = "crates/agentos-luau" }
agentos-luavm       = { path = "crates/agentos-luavm" }
agentos-sqlite      = { path = "crates/agentos-sqlite" }
agentos-fetch       = { path = "crates/agentos-fetch" }
agentos-mcp         = { path = "crates/agentos-mcp" }
agentos-acp         = { path = "crates/agentos-acp" }
agentos-agui        = { path = "crates/agentos-agui" }
agentos-http        = { path = "crates/agentos-http" }
agentos-codegen     = { path = "crates/agentos-codegen" }
# external
anyhow      = "1.0"
async-trait = "0.1"
# Standard PUC Lua 5.1, vendored (agentos-luavm). Never `luau` here: the two features cannot coexist.
mlua        = { version = "0.12.2", features = ["lua51", "vendored", "async", "serialize", "send", "macros"] }
notify      = "8.2"
parking_lot = "0.12"
rusqlite    = { version = "0.43.0", features = ["bundled", "hooks", "limits"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
thiserror   = "2"
axum        = { version = "0.8.9", features = ["ws", "macros"] }
rmcp        = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
tokio-util  = "0.7"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
getrandom   = "0.4"
if-addrs    = "0.15"
gethostname = "1"
toml        = { version = "1", default-features = false, features = ["parse", "serde"] }
ts-rs       = { version = "12.0.1", features = ["serde-json-impl"] }
schemars    = "1.2.3"
tower-http  = { version = "0.6.11", features = ["fs", "set-header", "trace"] }
tokio-tungstenite = "0.30"
tokio-stream = "0.1"
futures-util = "0.3"
futures-channel = "0.3"
agent-client-protocol = { version = "5.3.0", default-features = false }
reqwest     = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
tokio       = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"          # an adapter that truly needs unsafe opts out locally with a comment

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"            # tests opt out via clippy.toml (allow-unwrap-in-tests)
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
