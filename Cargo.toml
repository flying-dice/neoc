[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flying-dice/neoc"

[workspace.dependencies]
neoc-vm = { path = "crates/neoc-vm" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# enable case-by-case as crates land
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# mlua 0.12.2 vendored in `vendor/mlua` with the NEOC-124 fix to its message handler (`vendor/mlua-patches/`, and
# `vendor/README.md` for why). Remove this table once an upstream release carries the guard.
[patch.crates-io]
mlua = { path = "vendor/mlua" }
