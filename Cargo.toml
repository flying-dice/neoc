[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flying-dice/neoc"

[workspace.dependencies]
neoc-vm = { path = "crates/neoc-vm" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# enable case-by-case as crates land
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# mlua-sys builds Luau's C++ in its build script, with this package's opt level. At `opt-level = 0` a dev build runs
# the VM about 3 times slower (a 5e7-iteration numeric loop: 0.83 s against 0.28 s), where the LuaJIT it replaced was
# always built optimised, so build the engine optimised even in a dev build. (This is the package's own Rust code as
# well, a few small functions.)
[profile.dev.package.mlua-sys]
opt-level = 2
