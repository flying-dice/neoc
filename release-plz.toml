[workspace]
# release-plz creates the GitLab Release with the generated changelog as its
# description. The CI pipeline then attaches cross-compiled binary download
# links as release assets. See .gitlab-ci.yml for the full pipeline design.
changelog_update = true

[[package]]
name = "neoc"
# publish = false in Cargo.toml prevents crates.io publishing. Setting
# release = true keeps git tagging and GitLab Release creation active;
# publish = false here matches Cargo.toml so release-plz doesn't conflict.
release = true
publish = false
