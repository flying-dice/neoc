[workspace]
# release-plz creates the GitLab Release with the generated changelog as its
# description. The CI pipeline then attaches cross-compiled binary download
# links as release assets. See .gitlab-ci.yml for the full pipeline design.
changelog_update = true

[[package]]
name = "neoc"
# git_only = true tracks versions via git tags instead of the cargo registry.
# This lets release-plz manage changelogs, tags, and GitLab releases without
# ever touching crates.io, consistent with publish = false in Cargo.toml.
git_only = true
