name: Refinement
description: Propose new functionality, a surface change, or a behaviour change. The issue is the refinement surface; an owner pulls it from Backlog into Refinement before any work begins.
title: "[refinement] "
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > New issues land in **Backlog** on the project board. An owner pulls them into **Refinement** when the work is ready to be shaped.
        >
        > To leave Refinement, the issue must have a clear Definition of Done **and** exactly one of the labels `design-rfc`, `design-adr`, or `design-na`. See [`.claude/skills/agent-backlog-kanban/SKILL.md`](https://github.com/flying-dice/neoc/blob/main/.claude/skills/agent-backlog-kanban/SKILL.md) for the full workflow.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward, broken, or impossible today? Concrete scenarios beat abstract framing.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why now? What changes if this lands? Reference users, prior issues, or external evidence.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the change. Lua surface, error semantics, examples. Detail enough that a designer can act on it.
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Concrete, testable acceptance criteria. The Refinement → Design gate requires this to be filled in.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else was considered, including doing nothing.
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Anything still to decide before this can leave Refinement. Aim to empty this out before requesting an owner advance the ticket.
    validations:
      required: false
