name: RFC proposal
description: Stake out a cross-cutting design before drafting the RFC. Use this when work spans multiple modules, introduces a new namespace, or changes process/build/infrastructure.
title: "[rfc] "
labels:
  - rfc-required
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > This issue captures the rough shape of a proposal so it can be discussed before a full RFC is drafted.
        > If the issue advances to Design with the `design-rfc` label, the RFC document is authored on `design/{issue-id}-{slug}` and merged into the issue branch. See [`.claude/skills/agent-backlog-kanban/SKILL.md`](https://github.com/flying-dice/neoc/blob/main/.claude/skills/agent-backlog-kanban/SKILL.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph — what is being proposed and what changes if it lands.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The problem that justifies cross-cutting design effort. Why a single module's docs page is not enough.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Rough shape
      description: Enough of the design to evaluate whether it should proceed to a full RFC. Affected modules, surface changes, migration concerns.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else was considered, including doing nothing.
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Anything that must be answered before the RFC document is drafted.
    validations:
      required: false
