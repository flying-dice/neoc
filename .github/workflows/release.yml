name: Release

# Releases are cut by pushing a tag: git tag vX.Y.Z && git push origin vX.Y.Z
# A `-<pre>` suffix (v1.2.3-rc.1) publishes a GitHub pre-release. The tag must
# point at a commit on main; otherwise the workflow fails before building.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is a release tag
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME"
      - name: Tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main; releases are cut from main only"
            exit 1
          fi

  build-linux-x86_64:
    name: build:linux-x86_64
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Stamp version from tag
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME"
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo build --release -p neoc
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          strip target/release/neoc
          cp target/release/neoc artifacts/neoc-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: neoc-x86_64-unknown-linux-gnu
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  # Windows x86_64, cross-compiled via MinGW.
  build-windows-x86_64:
    name: build:windows-x86_64
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-gnu
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v7
      - name: Stamp version from tag
        run: scripts/stamp-version.sh "$GITHUB_REF_NAME"
      - name: Install MinGW
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Install pinned toolchain
        run: rustup show && rustup target add "$TARGET"
      - run: cargo build --release -p neoc --target "$TARGET"
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp "target/${TARGET}/release/neoc.exe" "artifacts/neoc-${TARGET}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: neoc-x86_64-pc-windows-gnu
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  release:
    name: publish release
    needs: [build-linux-x86_64, build-windows-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum neoc-* > SHA256SUMS
      - name: Create release
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}" \
            artifacts/neoc-x86_64-unknown-linux-gnu \
            artifacts/neoc-x86_64-pc-windows-gnu.exe \
            artifacts/SHA256SUMS
