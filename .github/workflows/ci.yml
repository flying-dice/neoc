name: CI

on:
  # CI minutes are limited: no pull_request or feature-branch triggers.
  # Runs on push to main/develop, manually, and on the weekly schedule.
  push:
    branches: [main, develop]
    paths-ignore: 
      - "docs/**"
      - "**/*.md"
      - "media/**"
      - "CODEOWNERS"
      - ".claude/**"
  workflow_dispatch:
  schedule:
    # Weekly bench run, Mondays 04:00 UTC.
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Toolchain: every job installs exactly what rust-toolchain.toml pins
# (channel, components, targets) via `rustup show`. Bump the pin there only.
#
# Cache isolation: each cache key embeds the ref, so a restored target/ only
# ever comes from the same branch (restore-keys never fall back to another
# ref). On top of that every job that restores target/ runs the
# "Clean workspace crates" step, dropping every workspace crate's artifacts so
# only third-party dependencies are reused (#107: stale-API E0061 from
# cargo's mtime fingerprints accepting another branch's rlibs).

jobs:
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLEAN_ARGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain pin sites agree
        run: scripts/check-toolchain-pin.sh
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo fmt --check
      - run: cargo clippy --all-targets

  deny:
    name: deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny (pinned, sha256-verified)
        run: |
          base="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${base}.tar.gz"
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-deny.tar.gz -C "$HOME/.local/bin" --strip-components=1 "${base}/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The advisory DB is fetched fresh on every run on purpose: a stale
      # cache would hide new advisories.
      - run: cargo-deny check advisories

  test:
    name: test
    if: github.event_name != 'schedule'
    needs: [lint]
    runs-on: ubuntu-latest
    # Hard cap so a hanging test (NEOC-27) fails the job instead of burning
    # the 6 h default.
    timeout-minutes: 60
    env:
      CLEAN_ARGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo build
      # Full workspace suite: runtime lib/bin tests plus the compiler's
      # integration tests (conformance, cli, LSP). The Lua conformance trials
      # run in-process on LuaJIT; only the Rust anchor trials are ignored when
      # rustc is absent.
      - run: cargo test --workspace
      # Docker-dependent suites (sqlx_mysql, sqlx_postgres,
      # testcontainers_modules) are excluded: they need a live Docker daemon.
      - name: Script suites (neoc run)
        run: |
          cargo run -p neoc -- run \
            "crates/neoc/tests/lib/*.test.lua" \
            "crates/neoc/tests/std/*.test.lua" \
            "crates/neoc/tests/vnd/jsonschema.test.lua" \
            "crates/neoc/tests/vnd/quick_xml.test.lua" \
            "crates/neoc/tests/vnd/rusqlite.test.lua" \
            "crates/neoc/tests/vnd/serde_json.test.lua" \
            "crates/neoc/tests/vnd/serde_yaml.test.lua" \
            "crates/neoc/tests/vnd/toml.test.lua"

  # Demo packages: committed packages/*/src/auto output must match `neoc build`,
  # and every package `start` host must run under LuaJIT (scripts/check-packages.sh).
  packages:
    name: packages
    if: github.event_name != 'schedule'
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLEAN_ARGS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install LuaJIT and jq
        run: sudo apt-get update && sudo apt-get install -y luajit jq
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: packages
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo build -p neoc
      - run: scripts/check-packages.sh

  # The pure transform crates must stay host-free so the browser build remains
  # viable. The parser/compiler graph links the tree-sitter C runtime, which
  # does not yet cross-compile to wasm32-unknown-unknown, so the gate guards
  # the leaf crates, where host-dependency creep would start.
  wasm:
    name: wasm
    if: github.event_name != 'schedule'
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLEAN_ARGS: --target wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo check --target wasm32-unknown-unknown -p neoc-ast -p neoc-macros -p neoc-codegen-lua

  # Criterion benches for neoc-vm. Informational only: no baseline comparison,
  # no gating. Manual dispatch or the weekly schedule, never per push/PR.
  # target/criterion is wiped so criterion never compares against estimates
  # restored from a cache.
  bench:
    name: bench
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLEAN_ARGS: --release
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          key: ${{ github.ref }}
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: rm -rf target/criterion
      - run: cargo bench -p neoc-vm --bench lib --features bench -- --noplot | tee bench-lib.txt
        shell: bash
      - run: cargo bench -p neoc-vm --bench vnd --features bench -- --noplot | tee bench-vnd.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: |
            bench-lib.txt
            bench-vnd.txt
          retention-days: 30

  # Build jobs are independent of lint/test so binaries are produced for every
  # commit, even on WIP branches. Check lint/test for the quality gates.
  build-linux-x86_64:
    name: build:linux-x86_64
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLEAN_ARGS: --release
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-x86_64-linux-gnu
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo build --release
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          strip target/release/neoc
          cp target/release/neoc artifacts/neoc-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: neoc-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  # Windows x86_64, cross-compiled via MinGW.
  build-windows-x86_64:
    name: build:windows-x86_64
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-gnu
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CLEAN_ARGS: --release --target x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Install pinned toolchain
        run: rustup show && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-x86_64-windows-gnu
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo build --release --target "$TARGET"
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp "target/${TARGET}/release/neoc.exe" "artifacts/neoc-${TARGET}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: neoc-x86_64-pc-windows-gnu-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  # Pre-merge guard for release-plz.toml: runs the pinned binary's `update`
  # (local only: no token, no push, no publish) and asserts the resolved
  # package set is exactly `neoc`. Only runs when a file that can affect the
  # release config differs from main. release-plz-* branches are skipped.
  # Pinned to v0.3.157: v0.3.158 breaks check_publish_fields for publish=false
  # workspaces (https://github.com/release-plz/release-plz/issues/2693). Bump
  # version and sha256 together (x86_64-unknown-linux-gnu tarball digest).
  release-plz-config:
    name: release-plz:config
    if: github.event_name != 'schedule' && !startsWith(github.head_ref || github.ref_name, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_PLZ_VERSION: "0.3.157"
      RELEASE_PLZ_SHA256: e9ec7c7e86ef364a5c19197c48b8e084ada60dc27382643ad19fafc68b441c34
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      # Full clone so release-plz can see all tags and main can be diffed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect release-config changes
        id: changes
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet origin main
          if git diff --name-only origin/main...HEAD | grep -Eq \
            '^(release-plz\.toml|\.github/workflows/ci\.yml|Cargo\.toml|crates/[^/]+/Cargo\.toml|rust-toolchain\.toml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No release-config changes vs main; skipping."
          fi
      - name: Install pinned toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup show
      - name: Install release-plz (pinned, sha256-verified)
        if: steps.changes.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/release-plz.tar.gz \
            "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-x86_64-unknown-linux-gnu.tar.gz"
          echo "${RELEASE_PLZ_SHA256}  /tmp/release-plz.tar.gz" | sha256sum -c -
          tar -xzf /tmp/release-plz.tar.gz -C "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate release-plz.toml
        if: steps.changes.outputs.run == 'true'
        run: |
          # release-plz needs a branch ref, not a detached HEAD.
          git checkout -B "$BRANCH"
          # Log outside the work tree: release-plz refuses to run on a dirty tree.
          release-plz update --config release-plz.toml -vv > /tmp/release-plz.log 2>&1 || { cat /tmp/release-plz.log; exit 1; }
          grep -F "Release order:" /tmp/release-plz.log
          grep -qF 'Release order: [PackageName("neoc")]' /tmp/release-plz.log
