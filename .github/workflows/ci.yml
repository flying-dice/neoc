name: CI

on:
  # Runs on every pull request (whatever its base: a stacked pull request
  # too), on push to main, and manually (the repository is public: minutes
  # are not a constraint).
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Toolchain: every job installs exactly what rust-toolchain.toml pins
# (channel, components, targets) via `rustup show`. Bump the pin there only.
#
# Cache isolation: each cache key embeds the ref, so a restored target/ only
# ever comes from the same branch (restore-keys never fall back to another
# ref). On top of that every job that restores target/ runs the
# "Clean workspace crates" step, dropping every workspace crate's artifacts so
# only third-party dependencies are reused (#107: stale-API E0061 from
# cargo's mtime fingerprints accepting another branch's rlibs).

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLEAN_ARGS: ""
    steps:
      - uses: actions/checkout@v7
      - name: Check toolchain pin sites agree
        run: scripts/check-toolchain-pin.sh
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo fmt --check
      - run: cargo clippy --all-targets

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.22.0"
      CARGO_DENY_SHA256: "98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786"
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny (pinned, sha256-verified)
        run: |
          base="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${base}.tar.gz"
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-deny.tar.gz -C "$HOME/.local/bin" --strip-components=1 "${base}/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The advisory DB is fetched fresh on every run on purpose: a stale
      # cache would hide new advisories.
      - run: cargo-deny check advisories

  test:
    name: test (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Hard cap so a hanging test (NEOC-27) fails the job instead of burning
    # the 6 h default.
    timeout-minutes: 60
    env:
      CLEAN_ARGS: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo build
      # neoc's own suite: runtime lib tests plus the `neoc` binary's CLI
      # integration tests and Gherkin spec. The vos crates' tests need bun and darklua
      # which this job does not install, so they are not run here.
      # (`neoc-*`: the runtime's crates, `neoc-vm-core`, `neoc-vm-std`, `neoc-vm-lib-*` and `neoc-vm-vnd-*`, with their tests)
      - run: cargo test -p neoc -p 'neoc-*'
      # The native service manager tests (NEOC-378) register, start, change and remove a real service, which is fine on
      # a throwaway runner and is why they run only where NEOC_NATIVE_SERVICE_TESTS=1: systemd on Linux, launchd on
      # macOS (both as root, the way a system service is managed) and the Service Control Manager on Windows (the
      # runner is the administrator). The refusal without rights runs first, as the runner user.
      - name: Native service manager (systemd, launchd, Service Control Manager)
        env:
          NEOC_NATIVE_SERVICE_TESTS: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo test -p neoc-vm-vnd-service_manager --lib -- --test-threads=1 --nocapture native_round_trip native_discovery
          else
            cargo test -p neoc-vm-vnd-service_manager --lib -- --test-threads=1 --nocapture native_system_level native_discovery
            bin=$(cargo test -p neoc-vm-vnd-service_manager --lib --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and (.target.name | test("service_manager"))) | .executable' \
              | head -n 1)
            test -n "$bin"
            sudo -E "$bin" --test-threads=1 --nocapture native_round_trip
          fi

  # The vos checks that need bun: the generated files against the Rust schema,
  # the Luau fixtures against the generated declarations, the type checks and
  # the bun tests (the lists are package.json's: `codegen:check`, `lint:luau`,
  # `typecheck`, and the bun half of `test`). Not here: the rest of
  # `bun run lint`, `cargo nextest` over the vos crates, and `test:e2e`.
  js:
    name: js
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLEAN_ARGS: ""
      BUN_VERSION: "1.4.5"
      # The versions the repository pins: LUAU_LSP_VERSION and DARKLUA_VERSION
      # in scripts/lint-luau.ts and packages/vite-plugin/src/build.ts.
      LUAU_LSP_VERSION: "1.70.1"
      LUAU_LSP_SHA256: "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567"
      DARKLUA_VERSION: "0.18.0"
      DARKLUA_SHA256: "3826cd216ec1e1e055dbb6e546cff1e3f35a3a6203279d3fa462229182d85957"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: js
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install luau-lsp and darklua (pinned, sha256-verified)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/luau-lsp.zip             "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          curl -fsSL -o /tmp/darklua.zip             "https://github.com/seaofvoices/darklua/releases/download/v${DARKLUA_VERSION}/darklua-linux-x86_64.zip"
          sha256sum -c - <<EOF
          ${LUAU_LSP_SHA256}  /tmp/luau-lsp.zip
          ${DARKLUA_SHA256}  /tmp/darklua.zip
          EOF
          unzip -q /tmp/luau-lsp.zip -d "$HOME/.local/bin"
          unzip -q /tmp/darklua.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau-lsp" "$HOME/.local/bin/darklua"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run codegen:check
      - run: bun run lint:luau
      - run: bun run typecheck
      - run: bun test types scripts
      - run: bun run --filter '*' test

  # Build jobs are independent of lint/test so binaries are produced for every
  # push to main even when lint or test fails. Check lint/test for the quality
  # signal. Not on pull requests: nobody downloads a binary of one.
  build-linux-x86_64:
    name: build:linux-x86_64
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLEAN_ARGS: --release
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-x86_64-linux-gnu
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo build --release -p neoc
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          strip target/release/neoc
          cp target/release/neoc artifacts/neoc-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: neoc-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  # Windows x86_64, cross-compiled via MinGW.
  build-windows-x86_64:
    name: build:windows-x86_64
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-gnu
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CLEAN_ARGS: --release --target x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Install pinned toolchain
        run: rustup show && rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-x86_64-windows-gnu
          key: ${{ github.ref }}
          save-if: true
      - name: Clean workspace crates
        run: |
          crates=$(cargo tree --workspace --depth 0 --prefix none | awk 'NF {print $1}')
          test -n "$crates"
          cargo clean $(printf -- '-p %s ' $crates) $CLEAN_ARGS
      - run: cargo build --release -p neoc --target "$TARGET"
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp "target/${TARGET}/release/neoc.exe" "artifacts/neoc-${TARGET}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: neoc-x86_64-pc-windows-gnu-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  # Builds the Dockerfile (no push) and smoke-runs the image. Gated to commits
  # that touch image inputs (Dockerfile, .dockerignore, Cargo.toml/.lock,
  # rust-toolchain.toml, crate manifests); a manual dispatch always builds.
  # Not on pull requests, like the release builds above.
  # A manifest target whose path `.dockerignore` drops fails here (NEOC-26).
  docker:
    name: docker:build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect image-input changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Capture first: `grep -q` closing the pipe early trips pipefail.
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -Eq \
            '^(Dockerfile|\.dockerignore|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|crates/.*/Cargo\.toml)$' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No image-input changes; skipping."
          fi
      - name: Build image
        if: steps.changes.outputs.run == 'true'
        run: docker build -t neoc:ci .
      - name: Smoke test
        if: steps.changes.outputs.run == 'true'
        run: docker run --rm neoc:ci --version
