name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Run Criterion benches
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench lib --features bench 2>&1 | tee bench-lib.txt
      - run: cargo bench --bench vnd --features bench 2>&1 | tee bench-vnd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-lib.txt
            bench-vnd.txt
