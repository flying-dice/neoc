# cargo-deny policy. CI runs `cargo deny check advisories` (job `deny`).
# Every ignore carries a reason, a tracking issue and a review date (= issue due
# date); delete the entry as soon as the upstream fix is adopted.

[advisories]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing side-channel (https://github.com/RustCrypto/RSA/issues/626), no fixed release. rsa is the only pure-Rust RSA backend and RustCrypto is sanctioned (#35). Pulled by lib:pkey and sqlx-mysql. Remove once rsa ships a constant-time fix (#51). Review: 2027-01-10." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, no vuln advisory. Ships in neoc via neoc-vm -> serde_yaml 0.9 (vnd:serde_yaml); no safe upgrade exists. Replacement tracked in NEOC-91. Review: 2027-01-10." },
]
