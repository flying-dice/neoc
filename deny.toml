# cargo-deny: supply chain (licenses, advisories, sources) + a declarative second line of defence for
# "framework crates only in adapters" (the first line is scripts/check-deps.ts). Run: cargo deny check
[graph]
all-features = false
exclude-dev = true   # dev-dependencies (test clients) are not part of the shipped dependency graph

[bans]
# Duplicate versions come from the fast-moving protocol crates (rmcp, reqwest, rustls); not ours to fix.
multiple-versions = "allow"
# `wrappers` = only these crates may depend on the banned crate directly.
deny = [
  { crate = "mlua", wrappers = ["agentos-luau"], reason = "Luau lives in the luau adapter" },
  { crate = "rusqlite", wrappers = ["agentos-sqlite"], reason = "SQLite lives in the sqlite adapter" },
  { crate = "rmcp", wrappers = ["agentos-mcp"], reason = "MCP lives in the mcp adapter" },
  { crate = "agent-client-protocol", wrappers = ["agentos-acp"], reason = "ACP lives in the acp adapter" },
  { crate = "axum", wrappers = ["agentos-http", "agentos-mcp", "agentos-agui", "agentos-host"], reason = "HTTP stack in driving adapters and the host" },
  { crate = "axum-server", wrappers = ["agentos-host"], reason = "TLS termination is wiring: the host owns the listener" },
  # rustls only: no system OpenSSL, so the host stays one self-contained binary
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "native-tls" },
]

[licenses]
# our own crates are `publish = false` and carry no license field
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
]

[advisories]
# `unmaintained` is informational, not a vulnerability: chrono arrives through rmcp and schemars and we do not
# use it. Revisit when rmcp or schemars drop it.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (not vulnerable); transitive via rmcp and schemars" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
