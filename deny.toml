# cargo-deny policy: `cargo deny check` (advisories, bans, licenses, sources)
# must pass. CI runs `cargo deny check advisories` (job `deny`).
# Every advisory ignore carries a reason, an upstream link and whether a fixed
# version exists; delete the entry as soon as the upstream fix is adopted.
#
# One policy for the whole workspace: neoc (the `neoc` CLI over `neoc-vm`) and vos (the host, apps, client).

# No `targets`: every platform's dependencies are checked. The vos host is meant for home-lab boxes and NAS units
# (Linux on x86_64 and aarch64, macOS on a developer machine), so the bans (no OpenSSL, mlua and the framework crates
# pinned to their crate) and the licenses must hold for all of them, not for the two triples neoc ships.
[graph]

[bans]
# Duplicate versions come from the fast-moving protocol crates (rmcp, reqwest, rustls); not ours to fix.
multiple-versions = "allow"
# `wrappers` = only these crates may depend on the banned crate directly.
deny = [
  # the Lua adapter reaches mlua through neoc-vm's re-export: it does not depend on it directly
  { crate = "mlua", wrappers = ["neoc-vm", "neoc-vm-core", "mlua-ir", "neoc"], reason = "Lua lives in the VM crates (neoc-vm-core, neoc-vm-std and the neoc-lib-* and neoc-vnd-* module crates), written with mlua-ir (the neoc CLI names the error type it surfaces)" },
  { crate = "neoc-vm", wrappers = ["vos-lua", "neoc"], reason = "only the Lua adapter wires the VM library to the AppRuntime port (and the neoc CLI is its own front end)" },
  # the VM exposes SQLite to scripts as `vnd:rusqlite`
  { crate = "rusqlite", wrappers = ["vos-sqlite", "neoc-vm"], reason = "SQLite lives in the sqlite adapter (and the VM's vnd:rusqlite module)" },
  # `wrappers` also sees dev-dependencies (the graph keeps them so neoc's test-only crates stay checked): the host's
  # end-to-end tests use rmcp as the MCP client, and the fetch tests run an axum server. That makes these two bans
  # blind to a move from dev to normal dependency, so scripts/check-deps.ts (FRAMEWORK_HOMES) holds the normal edges.
  { crate = "rmcp", wrappers = ["vos-mcp", "vos-host"], reason = "MCP lives in the mcp adapter (vos-host: dev-dependency, the test client)" },
  { crate = "axum", wrappers = ["vos-http", "vos-mcp", "vos-host", "vos-fetch", "tonic"], reason = "HTTP stack in driving adapters and the host (vos-fetch: dev-dependency, a test server; tonic: gRPC under neoc-vm's vnd:testcontainers_modules)" },
  { crate = "axum-server", wrappers = ["vos-host"], reason = "TLS termination is wiring: the host owns the listener" },
  # rustls only: no system OpenSSL, so every binary stays self-contained
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "native-tls" },
]

[advisories]
yanked = "warn"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, no vulnerability advisory, no fixed version (serde_yaml is archived at 0.9.34+deprecated). Ships in neoc and the vos host via neoc-vm -> serde_yaml 0.9 (vnd:serde_yaml); no safe upgrade exists. Upstream: https://github.com/dtolnay/serde-yaml/releases/tag/0.9.34 and https://rustsec.org/advisories/RUSTSEC-2024-0449. Replacement tracked in NEOC-91. Review: 2027-01-10." },
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar unmaintained (Astral ended maintenance 2026-11-03), no vulnerability advisory, no fixed version: every release is deprecated. Pulled by testcontainers 0.27 and 0.28 (^0.6.1) via testcontainers-modules 0.15, which backs vnd:testcontainers_modules; no testcontainers release has dropped it yet. Upstream: https://github.com/astral-sh/tokio-tar/pull/130 and https://rustsec.org/advisories/RUSTSEC-2026-0440. Remove once testcontainers moves to a maintained tar crate. Review: 2027-01-10." },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained (it wraps chrono, which is unmaintained), no vulnerability advisory, no fixed version. Dev-dependency only: pulled by cucumber 0.23 for the Gherkin CLI spec (crates/neoc/tests/cucumber.rs), never linked into the neoc binary. Upstream: https://github.com/chronotope/chrono/issues/1768 and https://rustsec.org/advisories/RUSTSEC-2026-0542. Remove once cucumber drops humantime. Review: 2027-01-10." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (an advisory of the unmaintained kind: no vulnerability, no fixed version). Pulled by rmcp and by schemars, which rmcp uses (cargo tree -i chrono); not used directly. Upstream: https://github.com/chronotope/chrono/issues/1768 and https://rustsec.org/advisories/RUSTSEC-2026-0543. Revisit when rmcp and schemars drop it. Review: 2027-01-10." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained as a crate of its own, no vulnerability advisory, no fixed version of the 5.x line: the crate was folded into zbus 6. Linux and the other Unixes only: pulled by zbus 5 under secret-service 5.2, which zbus-secret-service-keyring-store 1.0 (the Secret Service store of keyring 4.2, behind vnd:keyring) is built on; macOS and Windows do not link it. The other Secret Service store of keyring links libdbus, which the self-contained binaries rule out. Upstream: https://github.com/z-galaxy/zbus/issues/2043 and https://rustsec.org/advisories/RUSTSEC-2026-0370. Remove once secret-service (and the keyring store over it) moves to zbus 6. Review: 2027-01-10." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained as a crate of its own, no vulnerability advisory, no fixed version of the 5.x line: the crate was folded into zbus 6. Linux and the other Unixes only: pulled by zbus 5 under secret-service 5.2, which zbus-secret-service-keyring-store 1.0 (the Secret Service store of keyring 4.2, behind vnd:keyring) is built on; macOS and Windows do not link it. The other Secret Service store of keyring links libdbus, which the self-contained binaries rule out. Upstream: https://github.com/z-galaxy/zbus/issues/2043 and https://rustsec.org/advisories/RUSTSEC-2026-0371. Remove once secret-service (and the keyring store over it) moves to zbus 6. Review: 2027-01-10." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained as a crate of its own, no vulnerability advisory, no fixed version of the 5.x line: the crate was folded into zbus 6. Linux and the other Unixes only: pulled by zbus 5 under secret-service 5.2, which zbus-secret-service-keyring-store 1.0 (the Secret Service store of keyring 4.2, behind vnd:keyring) is built on; macOS and Windows do not link it. The other Secret Service store of keyring links libdbus, which the self-contained binaries rule out. Upstream: https://github.com/z-galaxy/zbus/issues/2043 and https://rustsec.org/advisories/RUSTSEC-2026-0372. Remove once secret-service (and the keyring store over it) moves to zbus 6. Review: 2027-01-10." },
]

[licenses]
# The neoc crates carry the workspace license (MIT OR Apache-2.0); the vos crates are `publish = false` and carry
# none. Every third-party license in the tree is permissive. Anything not listed fails.
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# mlua-ir (the macros and the schema neoc-vm's modules are written with) is a git dependency, pinned to a revision
# in the workspace Cargo.toml.
allow-git = ["https://github.com/flying-dice/mlua-ir.git"]
