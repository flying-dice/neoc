doc-valid-idents = ["LuaJIT", ".."]   # ".." keeps clippy's default list (GitHub, SQLite, ...)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# `add_async_meta_*` do not exist on Luau (a metamethod cannot yield there), so those entries are `allow-invalid`:
# they stay so that an engine that has them cannot use them outside `lifecycle`.
disallowed-methods = [
    { path = "mlua::Lua::create_async_function", reason = "use neoc_vm::lua::lifecycle::async_function: every async host function is a leaf with a Role (see lifecycle.rs)" },
    { path = "mlua::UserDataMethods::add_async_method", reason = "use neoc_vm::lua::lifecycle::async_method (see lifecycle.rs)" },
    { path = "mlua::UserDataMethods::add_async_method_mut", reason = "an async method is a leaf: make it with lifecycle::async_method (add a _mut variant there if one is needed)" },
    { path = "mlua::UserDataMethods::add_async_function", reason = "an async function is a leaf: make it with lifecycle::async_function" },
    { path = "mlua::UserDataMethods::add_async_method_once", reason = "an async method is a leaf: make it with lifecycle::async_method" },
    { path = "mlua::UserDataMethods::add_async_meta_method", reason = "an async metamethod is a leaf: make it with lifecycle::async_method (add a meta variant there if one is needed)", allow-invalid = true },
    { path = "mlua::UserDataMethods::add_async_meta_method_mut", reason = "an async metamethod is a leaf: make it with lifecycle::async_method (add a meta variant there if one is needed)", allow-invalid = true },
    { path = "mlua::UserDataMethods::add_async_meta_function", reason = "an async metamethod is a leaf: make it with lifecycle::async_function (add a meta variant there if one is needed)", allow-invalid = true },
    { path = "mlua::Function::wrap_async", reason = "an async function is a leaf: make it with lifecycle::async_function" },
    { path = "mlua::Function::wrap_raw_async", reason = "an async function is a leaf: make it with lifecycle::async_function" },
]
